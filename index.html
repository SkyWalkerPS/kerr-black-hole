  setUniform('skyPixelAngle', (2 * tanHalf) / (skyLevel?.height ?? outputHeight));
  setUniform('diskTime', time);
  setUniform('turbulenceLoopPeriod', settings.loopSeconds * settings.timeScale);
  setUniform('exposure', state.autoExposure * Math.pow(2, settings.exposure));
  setUniform('bloomStrength', settings.bloomStrength);
  setUniform('grainStrength', settings.grainStrength);
  setUniform('skyBrightness', settings.skyBrightness);
  setUniform('starBrightness', settings.starBrightness);
  setUniform('vignetteStrength', 0.18);
  setUniform('debugView', settings.debugView);
  setUniform('compositeFeatureMask', settings.compositeFeatureMask);
}

function updateUniformsForView(outputWidth, outputHeight, internalWidth, internalHeight, time) {
  const axes = blackHoleAxesInWorld(settings.diskTilt);
  const basis = cameraBasis();
  const positionBh = worldToBlackHole(axes, basis.position);
  if (Math.abs(positionBh[2]) < 1e-3) positionBh[2] = positionBh[2] < 0 ? -1e-3 : 1e-3;
  const basisBh = {
    forward: worldToBlackHole(axes, basis.forward),
    right: worldToBlackHole(axes, basis.right),
    up: worldToBlackHole(axes, basis.up),
  };
  writeCameraUniforms(settings.spin, cameraFrame(settings.spin, positionBh), basisBh, axes);
  writeDiskUniforms();
  writeStepUniforms();
  writeViewUniforms(outputWidth, outputHeight, internalWidth, internalHeight, time);
}

async function compileShaderModule(device, label, code) {
  const module = device.createShaderModule({ label, code });
  if (module.getCompilationInfo) {
    const info = await module.getCompilationInfo();
    const errors = info.messages.filter((message) => message.type === 'error');
    for (const message of info.messages) {
      const text = `${label} ${message.type} at line ${message.lineNum}:${message.linePos}: ${message.message}`;
      if (message.type === 'error') console.error(text); else console.warn(text);
    }
    if (errors.length) throw new Error(`${label}: ${errors[0].message} (line ${errors[0].lineNum})`);
  }
  return module;
}

function createMipGenerator(device, mipModule) {
  const layout = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } }],
  });
  const pipeline = device.createRenderPipeline({
    label: 'mip generation',
    layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }),
    vertex: { module: mipModule, entryPoint: 'fullscreenVertex' },
    fragment: { module: mipModule, entryPoint: 'mipFragment', targets: [{ format: 'rgba16float' }] },
    primitive: { topology: 'triangle-list' },
  });
  const layerView = (texture, layer, level) => texture.createView({ dimension: '2d', baseArrayLayer: layer, arrayLayerCount: 1, baseMipLevel: level, mipLevelCount: 1 });
  return {
    layerView,
    encode(encoder, texture, layerCount, levelCount) {
      for (let level = 1; level < levelCount; level++) {
        for (let layer = 0; layer < layerCount; layer++) {
          const pass = encoder.beginRenderPass({
            colorAttachments: [{ view: layerView(texture, layer, level), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }],
          });
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, device.createBindGroup({ layout, entries: [{ binding: 0, resource: layerView(texture, layer, level - 1) }] }));
          pass.draw(3);
          pass.end();
        }
      }
    },
  };
}

function createGalaxyCubemap(device, blackbodyTexture, galaxyModule, mipGenerator) {
  const mipLevelCount = Math.log2(GALAXY_FACE_SIZE) + 1;
  const texture = device.createTexture({
    label: 'galaxy cubemap',
    size: [GALAXY_FACE_SIZE, GALAXY_FACE_SIZE, 6],
    format: 'rgba16float',
    mipLevelCount,
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT,
  });
  const galaxyLayout = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
      { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'unfilterable-float' } },
    ],
  });
  const galaxyPipeline = device.createRenderPipeline({
    label: 'galaxy generation',
    layout: device.createPipelineLayout({ bindGroupLayouts: [galaxyLayout] }),
    vertex: { module: galaxyModule, entryPoint: 'fullscreenVertex' },
    fragment: { module: galaxyModule, entryPoint: 'galaxyFragment', targets: [{ format: 'rgba16float' }] },
    primitive: { topology: 'triangle-list' },
  });
  const encoder = device.createCommandEncoder({ label: 'galaxy build' });
  for (let face = 0; face < 6; face++) {
    const faceBuffer = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(faceBuffer, 0, new Float32Array([face, GALAXY_FACE_SIZE, 0, 0]));
    const pass = encoder.beginRenderPass({
      colorAttachments: [{ view: mipGenerator.layerView(texture, face, 0), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }],
    });
    pass.setPipeline(galaxyPipeline);
    pass.setBindGroup(0, device.createBindGroup({
      layout: galaxyLayout,
      entries: [{ binding: 0, resource: { buffer: faceBuffer } }, { binding: 1, resource: blackbodyTexture.createView() }],
    }));
    pass.draw(3);
    pass.end();
  }
  mipGenerator.encode(encoder, texture, 6, mipLevelCount);
  device.queue.submit([encoder.finish()]);
  return texture;
}

function createDiskNoiseTexture(device, noiseModule, mipGenerator) {
  const mipLevelCount = Math.log2(Math.max(DISK_NOISE_WIDTH, DISK_NOISE_HEIGHT)) + 1;
  const texture = device.createTexture({
    label: 'disk turbulence',
    size: [DISK_NOISE_WIDTH, DISK_NOISE_HEIGHT, 1],
    format: 'rgba16float',
    mipLevelCount,
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT,
  });
  const layout = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } }],
  });
  const pipeline = device.createRenderPipeline({
    label: 'disk turbulence generation',
    layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }),
    vertex: { module: noiseModule, entryPoint: 'fullscreenVertex' },
    fragment: { module: noiseModule, entryPoint: 'diskNoiseFragment', targets: [{ format: 'rgba16float' }] },
    primitive: { topology: 'triangle-list' },
  });
  const sizeBuffer = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(sizeBuffer, 0, new Float32Array([DISK_NOISE_WIDTH, DISK_NOISE_HEIGHT, 0, 0]));
  const encoder = device.createCommandEncoder({ label: 'disk turbulence build' });
  const pass = encoder.beginRenderPass({
    colorAttachments: [{ view: mipGenerator.layerView(texture, 0, 0), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }],
  });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, device.createBindGroup({ layout, entries: [{ binding: 0, resource: { buffer: sizeBuffer } }] }));
  pass.draw(3);
  pass.end();
  mipGenerator.encode(encoder, texture, 1, mipLevelCount);
  device.queue.submit([encoder.finish()]);
  return texture;
}

function makeFrameBindGroup(uniformBuffer) {
  return state.device.createBindGroup({
    layout: state.frameLayout,
    entries: [
      { binding: 0, resource: { buffer: uniformBuffer } },
      { binding: 1, resource: state.blackbodyTexture.createView() },
      { binding: 2, resource: state.diskNoiseTexture.createView() },
      { binding: 3, resource: state.repeatSampler },
    ],
  });
}

async function createRenderer() {
  if (!navigator.gpu) {
    showNotice(WEBGPU_HELP);
    return false;
  }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) {
    showNotice(WEBGPU_HELP.replace('Your browser did not provide WebGPU', 'Your browser has WebGPU but could not find a usable graphics adapter'));
    return false;
  }
  const requiredFeatures = adapter.features.has('timestamp-query') ? ['timestamp-query'] : [];
  const device = await adapter.requestDevice({ requiredFeatures });
  state.device = device;
  state.adapterInfo = adapter.info ? { vendor: adapter.info.vendor, architecture: adapter.info.architecture } : {};
  state.timestampsSupported = requiredFeatures.includes('timestamp-query');
  device.addEventListener('uncapturederror', (event) => console.error('WebGPU error:', event.error.message));
  device.lost.then((info) => {
    if (info.reason !== 'destroyed') showNotice(`<h1>The graphics device was lost</h1><p>${info.message || 'The GPU reset or the tab was suspended.'}</p><p>Reload the page to start again.</p>`);
  });

  state.context = state.canvas.getContext('webgpu');
  state.format = navigator.gpu.getPreferredCanvasFormat();
  state.context.configure({ device, format: state.format, alphaMode: 'opaque' });

  state.blackbodyTexture = device.createTexture({
    label: 'blackbody table', size: [BLACKBODY_TABLE_SIZE, 1], format: 'rgba32float',
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
  });
  device.queue.writeTexture({ texture: state.blackbodyTexture }, state.blackbodyTable, { bytesPerRow: BLACKBODY_TABLE_SIZE * 16 }, [BLACKBODY_TABLE_SIZE, 1]);
  document.documentElement.style.setProperty('--blackbody-ramp', `linear-gradient(90deg, ${[0, 0.2, 0.4, 0.6, 0.8, 1].map((t) => blackbodyCssColor(state.blackbodyTable, TEMPERATURE_SLIDER_MIN * Math.pow(TEMPERATURE_SLIDER_MAX / TEMPERATURE_SLIDER_MIN, t))).join(', ')})`);

  state.traceModuleCode = WGSL_SHARED + WGSL_FRAME_BINDINGS + WGSL_BLACKBODY + WGSL_TRACE;
  const [traceModule, bloomModule, compositeModule, skyModule, galaxyModule, mipModule, noiseModule] = await Promise.all([
    compileShaderModule(device, 'trace', state.traceModuleCode),
    compileShaderModule(device, 'bloom', WGSL_SHARED + WGSL_FRAME_BINDINGS + WGSL_BLOOM),
    compileShaderModule(device, 'composite', WGSL_SHARED + WGSL_FRAME_BINDINGS + WGSL_COMPOSITE),
    compileShaderModule(device, 'sky', WGSL_SHARED + WGSL_FRAME_BINDINGS + WGSL_BLACKBODY + WGSL_SKY),
    compileShaderModule(device, 'galaxy', WGSL_SHARED + WGSL_BLACKBODY + WGSL_GALAXY),
    compileShaderModule(device, 'mip', WGSL_SHARED + WGSL_MIP),
    compileShaderModule(device, 'disk turbulence', WGSL_SHARED + WGSL_DISK_NOISE),
  ]);
  const mipGenerator = createMipGenerator(device, mipModule);
  state.diskNoiseTexture = createDiskNoiseTexture(device, noiseModule, mipGenerator);
  state.repeatSampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear', addressModeU: 'repeat', addressModeV: 'repeat' });

  state.frameBuffer = device.createBuffer({ label: 'frame uniforms', size: frameLayout.byteSize, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  state.linearSampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });

  state.frameLayout = device.createBindGroupLayout({
    label: 'frame layout',
    entries: [
      { binding: 0, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
      { binding: 1, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.COMPUTE, texture: { sampleType: 'unfilterable-float' } },
      { binding: 2, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.COMPUTE, texture: { sampleType: 'float' } },
      { binding: 3, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.COMPUTE, sampler: { type: 'filtering' } },
    ],
  });
  state.frameBindGroup = makeFrameBindGroup(state.frameBuffer);

  state.bloomLayout = device.createBindGroupLayout({
    label: 'bloom layout',
    entries: [
      { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
      { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
      { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
    ],
  });
  state.skyLayout = device.createBindGroupLayout({
    label: 'sky layout',
    entries: [
      { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'unfilterable-float' } },
      { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float', viewDimension: 'cube' } },
      { binding: 2, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
    ],
  });
  state.compositeLayout = device.createBindGroupLayout({
    label: 'composite layout',
    entries: [
      { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
      { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
      { binding: 2, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
      { binding: 3, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
    ],
  });

  const fullscreen = (module, entryPoint, targets, layouts, blend) => device.createRenderPipelineAsync({
    label: entryPoint,
    layout: device.createPipelineLayout({ bindGroupLayouts: layouts }),
    vertex: { module, entryPoint: 'fullscreenVertex' },
    fragment: { module, entryPoint, targets: targets.map((format) => (blend ? { format, blend } : { format })) },
    primitive: { topology: 'triangle-list' },
  });
  const additive = { color: { srcFactor: 'one', dstFactor: 'one', operation: 'add' }, alpha: { srcFactor: 'one', dstFactor: 'one', operation: 'add' } };
  [state.tracePipeline, state.skyPipeline, state.bloomDownPipeline, state.bloomUpPipeline, state.compositePipeline] = await Promise.all([
    fullscreen(traceModule, 'traceFragment', ['rgba16float', 'rgba32float'], [state.frameLayout]),
    fullscreen(skyModule, 'skyFragment', ['rgba16float'], [state.frameLayout, state.skyLayout]),
    fullscreen(bloomModule, 'bloomDownsample', ['rgba16float'], [state.frameLayout, state.bloomLayout]),
    fullscreen(bloomModule, 'bloomUpsample', ['rgba16float'], [state.frameLayout, state.bloomLayout], additive),
    fullscreen(compositeModule, 'compositeFragment', [state.format], [state.frameLayout, state.compositeLayout]),
  ]);

  state.galaxyTexture = createGalaxyCubemap(device, state.blackbodyTexture, galaxyModule, mipGenerator);

  if (state.timestampsSupported) {
    state.querySet = device.createQuerySet({ type: 'timestamp', count: 4 });
    state.queryResolveBuffer = device.createBuffer({ size: 32, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
    state.queryReadbackPool = Array.from({ length: 4 }, () => device.createBuffer({ size: 32, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }));
  }
  return true;
}

function resizeCanvasIfNeeded() {
  const dpr = Math.min(window.devicePixelRatio || 1, isPhone ? PHONE_MAX_PIXEL_RATIO : Infinity);
  const width = Math.max(1, Math.round(state.canvas.clientWidth * dpr));
  const height = Math.max(1, Math.round(state.canvas.clientHeight * dpr));
  if (state.canvas.width !== width || state.canvas.height !== height) {
    state.canvas.width = width;
    state.canvas.height = height;
  }
  if (!state.bloomLevels || state.bloomLevels.outputWidth !== width || state.bloomLevels.outputHeight !== height) {
    createBloomLevels(width, height);
  }
}

function createBloomLevels(outputWidth, outputHeight) {
  const device = state.device;
  state.bloomLevels?.forEach((level) => level.texture.destroy());
  const levels = [];
  let width = Math.max(1, Math.floor(outputWidth / 4));
  let height = Math.max(1, Math.floor(outputHeight / 4));
  for (let i = 0; i < 6; i++) {
    const texture = device.createTexture({
      label: `bloom ${i}`, size: [width, height], format: 'rgba16float',
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
    });
    levels.push({ texture, view: texture.createView(), width, height });
    width = Math.max(1, Math.floor(width / 2));
    height = Math.max(1, Math.floor(height / 2));
  }
  levels.outputWidth = outputWidth;
  levels.outputHeight = outputHeight;
  state.bloomLevels = levels;
  state.skyRadiance?.texture.destroy();
  const skyWidth = Math.max(1, outputWidth);
  const skyHeight = Math.max(1, outputHeight);
  const skyTexture = device.createTexture({
    label: 'sky radiance', size: [skyWidth, skyHeight], format: 'rgba16float',
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT,
  });
  state.skyRadiance = { texture: skyTexture, view: skyTexture.createView(), width: skyWidth, height: skyHeight };
  state.bloomStageBuffers ??= Array.from({ length: 11 }, () => device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST }));
  if (state.renderTargets) {
    state.renderTargets.disk.destroy();
    state.renderTargets.sky.destroy();
  }
  state.renderTargets = null;
}

function renderTargetAllocationScale(scale) {
  return Math.min(1, Math.ceil(scale / RENDER_TARGET_SCALE_STEP - 1e-6) * RENDER_TARGET_SCALE_STEP);
}

const bloomStageData = new Float32Array(12);

function writeBloomStage(index, sourceWidth, sourceHeight, targetLevel, firstStage, spacing, sourceUvExtent) {
  const target = state.bloomLevels[targetLevel];
  bloomStageData.set([1 / sourceWidth, 1 / sourceHeight, target.width, target.height, spacing[0], spacing[1], sourceUvExtent[0], sourceUvExtent[1], firstStage ? 1 : 0, 0, 0, 0]);
  state.device.queue.writeBuffer(state.bloomStageBuffers[index], 0, bloomStageData);
}

function writeFirstBloomStage(internalWidth, internalHeight) {
  const targets = state.renderTargets;
  const level = state.bloomLevels[0];
  const spacing = [Math.max(1, (internalWidth / level.width) * 0.5), Math.max(1, (internalHeight / level.height) * 0.5)];
  writeBloomStage(0, targets.width, targets.height, 0, true, spacing, [internalWidth / targets.width, internalHeight / targets.height]);
}

function ensureRenderTargets(internalWidth, internalHeight, outputWidth, outputHeight, scale) {
  const device = state.device;
  const current = state.renderTargets;
  const fits = current && internalWidth <= current.width && internalHeight <= current.height;
  const wasteful = current && internalWidth * internalHeight < RENDER_TARGET_SHRINK_FRACTION * current.width * current.height;
  if (fits && !wasteful) {
    writeFirstBloomStage(internalWidth, internalHeight);
    return;
  }
  if (current) {
    current.disk.destroy();
    current.sky.destroy();
  }
  const allocationScale = renderTargetAllocationScale(scale);
  const width = Math.max(internalWidth, Math.round(outputWidth * allocationScale));
  const height = Math.max(internalHeight, Math.round(outputHeight * allocationScale));
  const disk = device.createTexture({ label: 'disk target', size: [width, height], format: 'rgba16float', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT });
  const sky = device.createTexture({ label: 'sky target', size: [width, height], format: 'rgba32float', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT });
  const diskView = disk.createView();
  const skyView = sky.createView();
  const levels = state.bloomLevels;
  const stages = [];
  const stageBindGroup = (index, sourceView) => device.createBindGroup({
    layout: state.bloomLayout,
    entries: [{ binding: 0, resource: sourceView }, { binding: 1, resource: state.linearSampler }, { binding: 2, resource: { buffer: state.bloomStageBuffers[index] } }],
  });
  stages.push({ bindGroup: stageBindGroup(0, diskView), target: levels[0], additive: false });
  for (let i = 1; i < levels.length; i++) {
    writeBloomStage(i, levels[i - 1].width, levels[i - 1].height, i, false, [1, 1], [1, 1]);
    stages.push({ bindGroup: stageBindGroup(i, levels[i - 1].view), target: levels[i], additive: false });
  }
  for (let i = levels.length - 2; i >= 0; i--) {
    const index = levels.length + (levels.length - 2 - i);
    writeBloomStage(index, levels[i + 1].width, levels[i + 1].height, i, false, [1, 1], [1, 1]);
    stages.push({ bindGroup: stageBindGroup(index, levels[i + 1].view), target: levels[i], additive: true });
  }
  const skyBindGroup = device.createBindGroup({
    layout: state.skyLayout,
    entries: [
      { binding: 0, resource: skyView },
      { binding: 1, resource: state.galaxyTexture.createView({ dimension: 'cube' }) },
      { binding: 2, resource: state.linearSampler },
    ],
  });
  const compositeBindGroup = device.createBindGroup({
    layout: state.compositeLayout,
    entries: [
      { binding: 0, resource: diskView },
      { binding: 1, resource: state.skyRadiance.view },
      { binding: 2, resource: levels[0].view },
      { binding: 3, resource: state.linearSampler },
    ],
  });
  state.renderTargets = { width, height, disk, sky, diskView, skyView, stages, skyBindGroup, compositeBindGroup };
  state.renderTargetGeneration = (state.renderTargetGeneration ?? 0) + 1;
  writeFirstBloomStage(internalWidth, internalHeight);
}

function encodeFrame(encoder, outputView, internalWidth, internalHeight) {
  const targets = state.renderTargets;
  const timestamps = state.timestampsSupported ? state.querySet : null;
  const tracePass = encoder.beginRenderPass({
    label: 'trace',
    colorAttachments: [
      { view: targets.diskView, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] },
      { view: targets.skyView, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] },
    ],
    ...(timestamps ? { timestampWrites: { querySet: timestamps, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1 } } : {}),
  });
  tracePass.setViewport(0, 0, internalWidth, internalHeight, 0, 1);
  tracePass.setScissorRect(0, 0, internalWidth, internalHeight);
  tracePass.setPipeline(state.tracePipeline);
  tracePass.setBindGroup(0, state.frameBindGroup);
  tracePass.draw(3);
  tracePass.end();

  const skyPass = encoder.beginRenderPass({
    label: 'sky',
    colorAttachments: [{ view: state.skyRadiance.view, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }],
  });
  skyPass.setPipeline(state.skyPipeline);
  skyPass.setBindGroup(0, state.frameBindGroup);
  skyPass.setBindGroup(1, targets.skyBindGroup);
  skyPass.draw(3);
  skyPass.end();

  for (const stage of targets.stages) {
    const pass = encoder.beginRenderPass({
      label: 'bloom',
      colorAttachments: [{ view: stage.target.view, loadOp: stage.additive ? 'load' : 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }],
    });
    pass.setPipeline(stage.additive ? state.bloomUpPipeline : state.bloomDownPipeline);
    pass.setBindGroup(0, state.frameBindGroup);
    pass.setBindGroup(1, stage.bindGroup);
    pass.draw(3);
    pass.end();
  }

  const compositePass = encoder.beginRenderPass({
    label: 'composite',
    colorAttachments: [{ view: outputView, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }],
    ...(timestamps ? { timestampWrites: { querySet: timestamps, beginningOfPassWriteIndex: 2, endOfPassWriteIndex: 3 } } : {}),
  });
  compositePass.setPipeline(state.compositePipeline);
  compositePass.setBindGroup(0, state.frameBindGroup);
  compositePass.setBindGroup(1, targets.compositeBindGroup);
  compositePass.draw(3);
  compositePass.end();
}

function currentAnimationTime(now) {
  if (frozenTime !== null) return frozenTime;
  return ((now - state.startTime) / 1000) * settings.timeScale;
}

function renderFrame(now) {
  resizeCanvasIfNeeded();
  const outputWidth = state.canvas.width;
  const outputHeight = state.canvas.height;
  const scale = pinnedScale ?? state.renderScale;
  const scaleUsed = scale;
  const internalWidth = Math.max(16, Math.round(outputWidth * scale));
  const internalHeight = Math.max(16, Math.round(outputHeight * scale));
  ensureRenderTargets(internalWidth, internalHeight, outputWidth, outputHeight, scale);
  updateUniformsForView(outputWidth, outputHeight, internalWidth, internalHeight, currentAnimationTime(now));
  setUniform('renderTargetSize', [state.renderTargets.width, state.renderTargets.height]);
  const device = state.device;
  device.queue.writeBuffer(state.frameBuffer, 0, uniformData);
  const encoder = device.createCommandEncoder({ label: 'frame' });
  encodeFrame(encoder, state.context.getCurrentTexture().createView(), internalWidth, internalHeight);
  let readback = null;
  if (state.timestampsSupported && state.queryReadbackPool.length) {
    readback = state.queryReadbackPool.pop();
    encoder.resolveQuerySet(state.querySet, 0, 4, state.queryResolveBuffer, 0);
    encoder.copyBufferToBuffer(state.queryResolveBuffer, 0, readback, 0, 32);
  }
  const exposureProbe = state.exposureReadbackBusy || state.frameIndex % 2 ? null : encodeExposureProbe(encoder);
  const submittedAt = performance.now();
  device.queue.submit([encoder.finish()]);
  state.frameIndex++;
  if (exposureProbe) readExposureProbe(exposureProbe, now);
  const completion = readback
    ? readback.mapAsync(GPUMapMode.READ).then(() => {
      const times = new BigInt64Array(readback.getMappedRange().slice(0));
      readback.unmap();
      state.queryReadbackPool.push(readback);
      const traceMs = Number(times[1] - times[0]) / 1e6;
      const totalMs = Number(times[3] - times[0]) / 1e6;
      return { totalMs, traceMs, scale: scaleUsed };
    })
    : device.queue.onSubmittedWorkDone().then(() => ({ totalMs: performance.now() - submittedAt, traceMs: NaN, scale: scaleUsed }));
  return completion.then((timing) => {
    if (Number.isFinite(timing.totalMs) && timing.totalMs > 0 && timing.totalMs < 1000) {
      state.lastGpuMs = timing.totalMs;
      state.lastTraceMs = timing.traceMs;
      adaptRenderScale(timing);
    }
    return timing;
  });
}

const EXPOSURE_PROBE_LEVEL = 3;
const EXPOSURE_HISTOGRAM_BINS = 96;
const EXPOSURE_HISTOGRAM_MIN_LOG2 = -16;
const EXPOSURE_HISTOGRAM_BINS_PER_STOP = 4;

function encodeExposureProbe(encoder) {
  const level = state.bloomLevels[Math.min(EXPOSURE_PROBE_LEVEL, state.bloomLevels.length - 1)];
  const bytesPerRow = Math.ceil((level.width * 8) / 256) * 256;
  const size = bytesPerRow * level.height;
  if (!state.exposureReadbackBuffer || state.exposureReadbackBuffer.size !== size) {
    state.exposureReadbackBuffer?.destroy();
    state.exposureReadbackBuffer = state.device.createBuffer({ size, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  }
  encoder.copyTextureToBuffer({ texture: level.texture }, { buffer: state.exposureReadbackBuffer, bytesPerRow }, [level.width, level.height]);
  state.exposureReadbackBusy = true;
  return { buffer: state.exposureReadbackBuffer, width: level.width, height: level.height, bytesPerRow };
}

function halfToFloat(bits) {
  const exponent = (bits >> 10) & 0x1f;
  const fraction = bits & 0x3ff;
  const sign = bits & 0x8000 ? -1 : 1;
  if (exponent === 0) return sign * 5.960464477539063e-8 * fraction;
  if (exponent === 31) return fraction ? 0 : sign * 65504;
  return sign * Math.pow(2, exponent - 15) * (1 + fraction / 1024);
}

function brightLuminanceFromProbe(halves, probe) {
  const histogram = new Uint32Array(EXPOSURE_HISTOGRAM_BINS);
  let count = 0;
  for (let y = 0; y < probe.height; y++) {
    const rowStart = (y * probe.bytesPerRow) / 2;
    for (let x = 0; x < probe.width; x++) {
      const base = rowStart + x * 4;
      const value = 0.2126 * halfToFloat(halves[base]) + 0.7152 * halfToFloat(halves[base + 1]) + 0.0722 * halfToFloat(halves[base + 2]);
      const bin = Math.floor((Math.log2(Math.max(value, 1e-9)) - EXPOSURE_HISTOGRAM_MIN_LOG2) * EXPOSURE_HISTOGRAM_BINS_PER_STOP);
      histogram[clampNumber(bin, 0, EXPOSURE_HISTOGRAM_BINS - 1)]++;
      count++;
    }
  }
  const binLog2 = (bin) => EXPOSURE_HISTOGRAM_MIN_LOG2 + (bin + 0.5) / EXPOSURE_HISTOGRAM_BINS_PER_STOP;
  let remaining = Math.max(1, Math.floor(count * (1 - AUTO_EXPOSURE_PERCENTILE)));
  let peakLog2 = EXPOSURE_HISTOGRAM_MIN_LOG2;
  for (let bin = EXPOSURE_HISTOGRAM_BINS - 1; bin >= 0; bin--) {
    remaining -= histogram[bin];
    if (remaining <= 0) { peakLog2 = binLog2(bin); break; }
  }
  const floorLog2 = peakLog2 - AUTO_EXPOSURE_DISK_RANGE_STOPS;
  let weightedLog2 = 0;
  let diskCount = 0;
  for (let bin = 0; bin < EXPOSURE_HISTOGRAM_BINS; bin++) {
    if (binLog2(bin) < floorLog2) continue;
    weightedLog2 += histogram[bin] * binLog2(bin);
    diskCount += histogram[bin];
  }
  return { peak: Math.pow(2, peakLog2), diskAverage: diskCount ? Math.pow(2, weightedLog2 / diskCount) : 0 };
}

function readExposureProbe(probe, now) {
  probe.buffer.mapAsync(GPUMapMode.READ).then(() => {
    const halves = new Uint16Array(probe.buffer.getMappedRange().slice(0));
    probe.buffer.unmap();
    state.exposureReadbackBusy = false;
    const { peak, diskAverage } = brightLuminanceFromProbe(halves, probe);
    const forMidtones = AUTO_EXPOSURE_MIDTONE_KEY / Math.max(diskAverage, 1e-5);
    const forHighlights = AUTO_EXPOSURE_HIGHLIGHT_LIMIT / Math.max(peak, 1e-5);
    const target = clampNumber(Math.min(forMidtones, forHighlights), AUTO_EXPOSURE_MIN, AUTO_EXPOSURE_MAX);
    const elapsed = state.lastExposureUpdate ? Math.min((now - state.lastExposureUpdate) / 1000, 0.25) : 1;
    state.lastExposureUpdate = now;
    const settle = frozenTime !== null ? 1 : 1 - Math.exp(-elapsed / AUTO_EXPOSURE_SECONDS);
    state.autoExposure = Math.exp(Math.log(state.autoExposure) + (Math.log(target) - Math.log(state.autoExposure)) * settle);
  }).catch(() => { state.exposureReadbackBusy = false; });
}

function adaptRenderScale(timing) {
  if (pinnedScale !== null) return;
  const scaleUsed = timing.scale;
  const totalMs = timing.totalMs;
  const traceMs = Number.isFinite(timing.traceMs) ? timing.traceMs : totalMs * 0.85;
  const fixedMs = Math.max(totalMs - traceMs, 0.2);
  const traceAtFullScaleMs = Math.max(traceMs / (scaleUsed * scaleUsed), 0.5);
  const blend = (previous, value, weight) => (previous === undefined ? value : previous + (value - previous) * weight);
  state.fixedMsSmoothed = blend(state.fixedMsSmoothed, fixedMs, 0.2);
  state.traceAtFullScaleSmoothed = blend(state.traceAtFullScaleSmoothed, traceAtFullScaleMs, 0.2);
  state.totalMsSmoothed = blend(state.totalMsSmoothed, totalMs, 0.15);
  state.framesSinceScaleChange++;
  const minScale = 0.3;
  const maxScale = 1.0;
  const current = state.renderScale;
  const idealFor = (fixed, traceFull) => Math.sqrt(Math.max(GPU_TARGET_MS - fixed, 1) / traceFull);
  let next = current;
  if (totalMs > GPU_TARGET_MS * 1.15 && state.framesSinceScaleChange > 1) {
    next = current * clampNumber(idealFor(fixedMs, traceAtFullScaleMs) / current, 0.85, 0.95);
  } else if (state.framesSinceScaleChange >= 12) {
    const ideal = idealFor(state.fixedMsSmoothed, state.traceAtFullScaleSmoothed);
    if (state.totalMsSmoothed > GPU_TARGET_MS * 1.05) next = Math.max(ideal, current * 0.92);
    else if (state.totalMsSmoothed < GPU_TARGET_MS) next = current * clampNumber(ideal / current, 1.015, 1.04);
  }
  next = Math.round(clampNumber(next, minScale, maxScale) * 200) / 200;
  if (next !== state.renderScale) {
    state.renderScale = next;
    state.framesSinceScaleChange = 0;
  }
  const idealAtCurrent = idealFor(state.fixedMsSmoothed, state.traceAtFullScaleSmoothed);
  if (state.renderScale <= minScale + 1e-3 && state.totalMsSmoothed > GPU_TARGET_MS * 1.05) {
    state.angleScale = Math.min(state.angleScale * 1.03, 1.8);
  } else if (idealAtCurrent > minScale * 1.15 || state.totalMsSmoothed < GPU_TARGET_MS * 0.85) {
    state.angleScale = Math.max(state.angleScale / 1.03, 1);
  }
}

function moveCamera(dt) {
  const keys = input.keys;
  const turn = (keys.has('arrowright') ? 1 : 0) - (keys.has('arrowleft') ? 1 : 0);
  const lift = (keys.has('arrowup') ? 1 : 0) - (keys.has('arrowdown') ? 1 : 0);
  camera.orbitAzimuth += turn * dt * ARROW_KEY_RADIANS_PER_SECOND - input.dragDelta[0] * DRAG_RADIANS_PER_PIXEL;
  camera.orbitElevation = clampNumber(
    camera.orbitElevation + lift * dt * ARROW_KEY_RADIANS_PER_SECOND + input.dragDelta[1] * DRAG_RADIANS_PER_PIXEL,
    -ORBIT_ELEVATION_LIMIT, ORBIT_ELEVATION_LIMIT);
  zoomCameraBy(0);
  input.dragDelta = [0, 0];
}

function isFullscreenActive() {
  return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
}

function canRequestFullscreen() {
  const element = document.documentElement;
  const enabled = document.fullscreenEnabled ?? document.webkitFullscreenEnabled ?? false;
  return Boolean(enabled && (element.requestFullscreen || element.webkitRequestFullscreen));
}

async function enterFullscreen() {
  const element = document.documentElement;
  const request = element.requestFullscreen || element.webkitRequestFullscreen;
  try {
    await request?.call(element, { navigationUI: 'hide' });
  } catch {
    return;
  }
  if (!isPhone) return;
  try {
    await screen.orientation?.lock?.('landscape');
  } catch {
    return;
  }
}

function toggleFullscreen() {
  if (isFullscreenActive()) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  else enterFullscreen();
}

function setPanelOpen(open) {
  document.getElementById('panel').classList.toggle('is-hidden', !open);
  document.getElementById('settings-button').setAttribute('aria-pressed', String(open));
  updateViewCenterShiftTarget();
}

function updateViewCenterShiftTarget() {
  const panel = document.getElementById('panel');
  const landscape = window.innerWidth > window.innerHeight;
  const shiftView = isPhone && landscape && !panel.classList.contains('is-hidden');
  state.viewCenterShiftTarget = shiftView ? (panel.offsetLeft + panel.offsetWidth) / window.innerWidth : 0;
  document.documentElement.style.setProperty('--view-center-x', `${50 + state.viewCenterShiftTarget * 50}%`);
}

function isPanelOpen() {
  return !document.getElementById('panel').classList.contains('is-hidden');
}

function showHintFor(seconds) {
  if (hideHint || state.hintShown) return;
  state.hintShown = true;
  const hint = document.getElementById('hint');
  hint.hidden = false;
  hint.classList.remove('is-hidden');
  setTimeout(() => hint.classList.add('is-hidden'), seconds * 1000);
}

function bindTouchLayout() {
  document.body.classList.toggle('is-touch', isTouchDevice);
  if (!isTouchDevice) return;
  document.getElementById('hint').textContent = 'Drag to orbit, pinch to zoom.';
  document.addEventListener('gesturestart', (event) => event.preventDefault());
  const settingsButton = document.getElementById('settings-button');
  settingsButton.addEventListener('click', () => {
    state.panelToggledByUser = true;
    setPanelOpen(!isPanelOpen());
  });
  const fullscreenButton = document.getElementById('fullscreen-button');
  const rotateFullscreenButton = document.getElementById('rotate-fullscreen');
  if (canRequestFullscreen()) {
    fullscreenButton.hidden = false;
    rotateFullscreenButton.hidden = !isPhone;
  }
  fullscreenButton.addEventListener('click', toggleFullscreen);
  rotateFullscreenButton.addEventListener('click', enterFullscreen);
  const syncFullscreenButton = () => fullscreenButton.setAttribute('aria-pressed', String(isFullscreenActive()));
  document.addEventListener('fullscreenchange', syncFullscreenButton);
  document.addEventListener('webkitfullscreenchange', syncFullscreenButton);
  if (!isPhone) return;
  const portraitQuery = window.matchMedia('(orientation: portrait)');
  const applyOrientation = () => {
    const portrait = portraitQuery.matches;
    document.body.classList.toggle('wants-landscape', portrait && !state.portraitAccepted);
    if (!state.panelToggledByUser) setPanelOpen(!portrait && searchParams.get('panel') !== '0');
    if (!portrait || state.portraitAccepted) showHintFor(PHONE_HINT_SECONDS);
  };
  document.getElementById('rotate-dismiss').addEventListener('click', () => {
    state.portraitAccepted = true;
    applyOrientation();
  });
  portraitQuery.addEventListener('change', applyOrientation);
  window.addEventListener('resize', updateViewCenterShiftTarget);
  applyOrientation();
}

function bindInput() {
  const canvas = state.canvas;
  const markInteraction = () => {
    input.lastInteraction = performance.now();
    document.getElementById('hint').classList.add('is-hidden');
  };
  const pinchDistance = () => {
    if (input.pointers.size !== 2) return 0;
    const [first, second] = [...input.pointers.values()];
    return Math.hypot(first[0] - second[0], first[1] - second[1]);
  };
  const releasePointer = (event) => {
    input.pointers.delete(event.pointerId);
    input.pinchDistance = pinchDistance();
    canvas.classList.toggle('is-dragging', input.pointers.size > 0);
  };
  canvas.addEventListener('pointerdown', (event) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    canvas.setPointerCapture?.(event.pointerId);
    input.pointers.set(event.pointerId, [event.clientX, event.clientY]);
    input.pinchDistance = pinchDistance();
    canvas.classList.add('is-dragging');
    canvas.focus({ preventScroll: true });
    markInteraction();
  });
  canvas.addEventListener('pointermove', (event) => {
    const previous = input.pointers.get(event.pointerId);
    if (!previous) return;
    const current = [event.clientX, event.clientY];
    input.pointers.set(event.pointerId, current);
    if (input.pointers.size === 1) {
      input.dragDelta[0] += current[0] - previous[0];
      input.dragDelta[1] += current[1] - previous[1];
    } else {
      const distance = pinchDistance();
      if (input.pinchDistance > 0 && distance > 0) zoomCameraBy(Math.log(input.pinchDistance / distance));
      input.pinchDistance = distance;
    }
  });
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();
    markInteraction();
    const pixels = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1);
    zoomCameraBy(pixels * (event.ctrlKey ? PINCH_WHEEL_ZOOM_PER_PIXEL : WHEEL_ZOOM_PER_PIXEL));
  }, { passive: false });
  window.addEventListener('keydown', (event) => {
    const key = event.key.toLowerCase();
    if (event.target instanceof HTMLInputElement && !['h', 'f'].includes(key)) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (key === 'h') {
      state.panelToggledByUser = true;
      setPanelOpen(!isPanelOpen());
      markInteraction();
      return;
    }
    if (key === 'f' && !event.repeat) {
      toggleFullscreen();
      markInteraction();
      return;
    }
    if (key === '+' || key === '=' || key === '-' || key === '_') {
      zoomCameraBy(key === '-' || key === '_' ? KEY_ZOOM_STEP : -KEY_ZOOM_STEP);
      markInteraction();
      return;
    }
    if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(key)) {
      event.preventDefault();
      input.keys.add(key);
      markInteraction();
    }
  });
  window.addEventListener('keyup', (event) => input.keys.delete(event.key.toLowerCase()));
  window.addEventListener('blur', () => input.keys.clear());
}

function bindPanel() {
  const spin = document.getElementById('spin');
  const temperature = document.getElementById('temperature');
  const tilt = document.getElementById('tilt');
  const steps = document.getElementById('steps');
  const exposure = document.getElementById('exposure');
  const physical = document.getElementById('color-physical');
  const cinematic = document.getElementById('color-cinematic');
  const temperatureFromSlider = (t) => TEMPERATURE_SLIDER_MIN * Math.pow(TEMPERATURE_SLIDER_MAX / TEMPERATURE_SLIDER_MIN, t);
  const sliderFromTemperature = (kelvin) => Math.log(kelvin / TEMPERATURE_SLIDER_MIN) / Math.log(TEMPERATURE_SLIDER_MAX / TEMPERATURE_SLIDER_MIN);
  const refresh = () => {
    spin.value = settings.spin;
    temperature.value = sliderFromTemperature(settings.diskTemperature);
    tilt.value = settings.diskTilt;
    steps.value = settings.maxSteps;
    exposure.value = settings.exposure;
    document.getElementById('spin-value').textContent = `a = ${settings.spin.toFixed(3)}`;
    document.getElementById('temperature-value').textContent = `${Math.round(settings.diskTemperature / 50) * 50} K`;
    document.getElementById('tilt-value').textContent = `${Math.round(settings.diskTilt)}°`;
    document.getElementById('steps-value').textContent = `${settings.maxSteps}`;
    document.getElementById('exposure-value').textContent = `${settings.exposure >= 0 ? '+' : ''}${settings.exposure.toFixed(1)} EV`;
    physical.setAttribute('aria-pressed', String(settings.colorMode === 'physical'));
    cinematic.setAttribute('aria-pressed', String(settings.colorMode === 'cinematic'));
    document.documentElement.style.setProperty('--disk-color', blackbodyCssColor(state.blackbodyTable, Math.max(settings.diskTemperature, 2500)));
  };
  spin.addEventListener('input', () => {
    settings.spin = Number(spin.value);
    state.diskModel = pageThorneDiskModel(settings.spin);
    refresh();
  });
  temperature.addEventListener('input', () => { settings.diskTemperature = temperatureFromSlider(Number(temperature.value)); refresh(); });
  tilt.addEventListener('input', () => { settings.diskTilt = Number(tilt.value); refresh(); });
  steps.addEventListener('input', () => { settings.maxSteps = Number(steps.value); refresh(); });
  exposure.addEventListener('input', () => { settings.exposure = Number(exposure.value); refresh(); });
  physical.addEventListener('click', () => { settings.colorMode = 'physical'; refresh(); });
  cinematic.addEventListener('click', () => { settings.colorMode = 'cinematic'; refresh(); });
  state.refreshPanel = refresh;
  refresh();
}

function updateReadout(now) {
  state.fpsWindow.push(now);
  while (state.fpsWindow.length && now - state.fpsWindow[0] > 1000) state.fpsWindow.shift();
  if (now - (state.lastReadoutUpdate ?? 0) < 250) return;
  state.lastReadoutUpdate = now;
  document.getElementById('fps').textContent = String(state.fpsWindow.length);
  document.getElementById('gpu-time').textContent = state.lastGpuMs ? state.lastGpuMs.toFixed(1) : '--';
  const targets = state.renderTargets;
  const shownScale = pinnedScale ?? state.renderScale;
  if (targets) document.getElementById('render-scale').textContent = `${Math.round(shownScale * 100)}% resolution, ${Math.round(state.canvas.width * shownScale)}×${Math.round(state.canvas.height * shownScale)}`;
}

function onAnimationFrame(now) {
  requestAnimationFrame(onAnimationFrame);
  if (state.previousCallback !== undefined) {
    state.displayIntervals.push(now - state.previousCallback);
    if (state.displayIntervals.length > 40) state.displayIntervals.shift();
  }
  state.previousCallback = now;
  if (state.automationActive) return;
  if (state.callbackCount % 30 === 0 && state.displayIntervals.length) {
    const sorted = state.displayIntervals.slice().sort((a, b) => a - b);
    state.displayInterval = sorted[sorted.length >> 1];
  }
  const callbacksPerFrame = Math.max(1, Math.round(TARGET_FRAME_MS / Math.max(state.displayInterval ?? TARGET_FRAME_MS, 1)));
  state.callbackCount++;
  if (state.callbackCount % callbacksPerFrame !== 0) return;
  const dt = Math.min((now - (state.lastRenderTime || now)) / 1000, 0.1);
  state.lastRenderTime = now;
  moveCamera(dt);
  renderFrame(now);
  updateReadout(now);
}

function readSettingsSnapshot() {
  return { ...settings, camera: { ...camera }, renderScale: pinnedScale ?? state.renderScale, angleScale: state.angleScale };
}

async function runSelfTestRays({ spin, radius, thetaDegrees, phiDegrees, directions, maxSteps = 4000 }) {
  const device = state.device;
  if (!state.selfTestPipeline) {
    const module = await compileShaderModule(device, 'self test', state.traceModuleCode + WGSL_SELF_TEST);
    state.selfTestLayout = device.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
        { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      ],
    });
    state.selfTestPipeline = await device.createComputePipelineAsync({
      layout: device.createPipelineLayout({ bindGroupLayouts: [state.frameLayout, state.selfTestLayout] }),
      compute: { module, entryPoint: 'selfTestCompute' },
    });
  }
  const savedUniforms = uniformData.slice();
  const theta = thetaDegrees * DEGREES;
  const phi = phiDegrees * DEGREES;
  const spheroidal = Math.sqrt(radius * radius + spin * spin);
  const positionBh = [spheroidal * Math.sin(theta) * Math.cos(phi), spheroidal * Math.sin(theta) * Math.sin(phi), radius * Math.cos(theta)];
  const savedModel = state.diskModel;
  state.diskModel = pageThorneDiskModel(spin);
  writeCameraUniforms(spin, cameraFrame(spin, positionBh), { forward: [0, 0, 1], right: [1, 0, 0], up: [0, 1, 0] }, { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] });
  writeDiskUniforms();
  setUniform('stepAngleNear', 0.1);
  setUniform('stepAngleFar', 0.35);
  setUniform('stepRadialSpan', 0.1);
  setUniform('maxSteps', maxSteps);
  setUniform('diskOuterRadius', 1e9);
  setUniform('diskInnerRadius', 0);
  const testUniformBuffer = device.createBuffer({ size: frameLayout.byteSize, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(testUniformBuffer, 0, uniformData);
  uniformData.set(savedUniforms);
  state.diskModel = savedModel;
  const directionData = new Float32Array(directions.length * 4);
  directions.forEach((d, i) => directionData.set([d[0], d[1], d[2], 0], i * 4));
  const directionBuffer = device.createBuffer({ size: directionData.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(directionBuffer, 0, directionData);
  const recordBytes = directions.length * 48;
  const recordBuffer = device.createBuffer({ size: recordBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const readBuffer = device.createBuffer({ size: recordBytes, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(state.selfTestPipeline);
  pass.setBindGroup(0, makeFrameBindGroup(testUniformBuffer));
  pass.setBindGroup(1, device.createBindGroup({ layout: state.selfTestLayout, entries: [{ binding: 0, resource: { buffer: directionBuffer } }, { binding: 1, resource: { buffer: recordBuffer } }] }));
  pass.dispatchWorkgroups(Math.ceil(directions.length / 64));
  pass.end();
  encoder.copyBufferToBuffer(recordBuffer, 0, readBuffer, 0, recordBytes);
  device.queue.submit([encoder.finish()]);
  await readBuffer.mapAsync(GPUMapMode.READ);
  const values = Array.from(new Float32Array(readBuffer.getMappedRange()));
  readBuffer.unmap();
  [testUniformBuffer, directionBuffer, recordBuffer, readBuffer].forEach((buffer) => buffer.destroy());
  return directions.map((_, i) => {
    const base = i * 12;
    return {
      outcome: ['captured', 'escaped', 'maxsteps', 'opaque'][values[base]],
      steps: values[base + 1],
      crossings: values[base + 2],
      skyRedshift: values[base + 3],
      direction: values.slice(base + 4, base + 7),
      firstCrossing: { r: values[base + 8], phi: values[base + 9], t: values[base + 10], mu: values[base + 11] },
    };
  });
}

function exposeAutomation(readyPromise) {
  window.blackHole = {
    ready: readyPromise,
    settings,
    camera,
    snapshot: readSettingsSnapshot,
    set(partial) {
      Object.assign(settings, partial);
      if ('spin' in partial) state.diskModel = pageThorneDiskModel(settings.spin);
      state.refreshPanel?.();
    },
    setCamera(partial) {
      if (partial.orbitDistance !== undefined) camera.orbitDistance = partial.orbitDistance;
      if (partial.orbitAzimuthDegrees !== undefined) camera.orbitAzimuth = partial.orbitAzimuthDegrees * DEGREES;
      if (partial.orbitElevationDegrees !== undefined) camera.orbitElevation = partial.orbitElevationDegrees * DEGREES;
    },
    showPanel(visible) { setPanelOpen(visible); },
    hideHint() { document.getElementById('hint').classList.add('is-hidden'); },
    async renderFrames(count = 1, { at } = {}) {
      state.automationActive = true;
      let timing = null;
      for (let i = 0; i < count; i++) {
        timing = await renderFrame(at ?? performance.now());
        updateReadout(performance.now());
      }
      state.automationActive = false;
      return { timing, renderScale: pinnedScale ?? state.renderScale, size: [Math.round(state.canvas.width * (pinnedScale ?? state.renderScale)), Math.round(state.canvas.height * (pinnedScale ?? state.renderScale))] };
    },
    async benchmark({ frames = 240, warmup = 30, animate = true, paced = true } = {}) {
      state.automationActive = true;
      const gpuTimes = [];
      const traceTimes = [];
      const scales = [];
      const wallIntervals = [];
      let previous = performance.now();
      for (let i = 0; i < warmup + frames; i++) {
        if (paced) await new Promise((resolve) => requestAnimationFrame(resolve));
        const now = performance.now();
        const timing = await renderFrame(animate ? now : state.startTime);
        if (i >= warmup) {
          gpuTimes.push(timing.totalMs);
          traceTimes.push(timing.traceMs);
          scales.push(pinnedScale ?? state.renderScale);
          wallIntervals.push(now - previous);
        }
        previous = now;
      }
      state.automationActive = false;
      const finalScale = pinnedScale ?? state.renderScale;
      return { gpuTimes, traceTimes, scales, wallIntervals, timestamps: state.timestampsSupported, output: [state.canvas.width, state.canvas.height], internal: [Math.round(state.canvas.width * finalScale), Math.round(state.canvas.height * finalScale)], adapter: state.adapterInfo };
    },
    traceTestRays: runSelfTestRays,
    stats() {
      return { autoExposure: state.autoExposure, renderScale: pinnedScale ?? state.renderScale, angleScale: state.angleScale, lastGpuMs: state.lastGpuMs, lastTraceMs: state.lastTraceMs, renderTargetGeneration: state.renderTargetGeneration, output: [state.canvas.width, state.canvas.height], timestamps: state.timestampsSupported, adapter: state.adapterInfo };
    },
  };
}

async function main() {
  bindPanel();
  const panelStartsOpen = searchParams.get('panel') !== '0' && window.innerWidth >= PANEL_MIN_START_WIDTH;
  setPanelOpen(panelStartsOpen);
  bindTouchLayout();
  if (!isPhone) {
    if (panelStartsOpen) document.getElementById('hint').hidden = true;
    else showHintFor(8);
  }
  const ok = await createRenderer();
  if (!ok) return false;
  bindInput();
  requestAnimationFrame(onAnimationFrame);
  return true;
}

const ready = main().catch((error) => {
  console.error(error);
  showNotice(`<h1>The renderer failed to start</h1><p>${String(error.message || error).replace(/</g, '&lt;')}</p><p>Try the latest Chrome, or reload the page.</p>`);
  return false;
});
exposeAutomation(ready);
</script>
</body>
