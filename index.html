<script type="module">
const searchParams = new URLSearchParams(location.search);
const numberParam = (name, fallback) => {
  const raw = searchParams.get(name);
  const parsed = raw === null ? NaN : Number(raw);
  return Number.isFinite(parsed) ? parsed : fallback;
};

const settings = {
  spin: numberParam('spin', 0.9),
  diskTemperature: numberParam('temperature', 6000),
  diskTilt: numberParam('tilt', 0),
  maxSteps: numberParam('steps', 48),
  exposure: numberParam('exposure', 0),
  colorMode: searchParams.get('color') === 'cinematic' ? 'cinematic' : 'physical',
  bloomStrength: numberParam('bloom', 0.012),
  grainStrength: numberParam('grain', 0.03),
  skyBrightness: numberParam('sky', 1),
  starBrightness: numberParam('stars', 1),
  fieldOfViewDegrees: numberParam('fov', 110),
  timeScale: numberParam('timescale', 12),
  loopSeconds: numberParam('loop', 0),
  debugView: numberParam('debug', 0),
  compositeFeatureMask: numberParam('features', 15),
};
const frozenTime = searchParams.has('time') ? numberParam('time', 0) : null;
const pinnedScale = searchParams.has('scale') ? Math.min(Math.max(numberParam('scale', 1), 0.1), 1) : null;
const hideHint = searchParams.get('hint') === '0';
const PANEL_MIN_START_WIDTH = 700;
const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
const isPhone = isTouchDevice && Math.min(screen.width, screen.height) < 600;
const PHONE_MAX_PIXEL_RATIO = 2;
const PORTRAIT_WIDTH_FOV_WEIGHT = 0.5;
const PHONE_HINT_SECONDS = 7;
const VIEW_SHIFT_EASING = 0.14;

const DISK_OUTER_RADIUS = 24;
const TEMPERATURE_SLIDER_MIN = 1500;
const TEMPERATURE_SLIDER_MAX = 40000;
const BLACKBODY_TABLE_SIZE = 512;
const BLACKBODY_LOG2_MIN = Math.log2(250);
const BLACKBODY_LOG2_MAX = Math.log2(400000);
const GALAXY_FACE_SIZE = 1024;
const DISK_NOISE_WIDTH = 2048;
const AUTO_EXPOSURE_PERCENTILE = 0.995;
const AUTO_EXPOSURE_MIDTONE_KEY = 0.32;
const AUTO_EXPOSURE_HIGHLIGHT_LIMIT = 6;
const AUTO_EXPOSURE_DISK_RANGE_STOPS = 8;
const AUTO_EXPOSURE_MIN = 0.02;
const AUTO_EXPOSURE_MAX = 6;
const AUTO_EXPOSURE_SECONDS = 0.6;
const DISK_NOISE_HEIGHT = 512;
const TARGET_FRAME_MS = 1000 / 60;
const GPU_TARGET_MS = 11;
const RENDER_TARGET_SCALE_STEP = 0.1;
const RENDER_TARGET_SHRINK_FRACTION = 0.45;
const STAR_PSF_RADIUS_PIXELS = 1.35;
const STAR_HALO_CORE_PIXELS = 1.1;
const STAR_HALO_FALLOFF_POWER = 2.2;
const STAR_FLUX_AT_MAGNITUDE_ZERO = 1.6e-4;
function fitStarColorPolynomials(table) {
  const samples = [];
  for (let i = 0; i < BLACKBODY_TABLE_SIZE; i++) {
    const log2Temperature = BLACKBODY_LOG2_MIN + (BLACKBODY_LOG2_MAX - BLACKBODY_LOG2_MIN) * (i / (BLACKBODY_TABLE_SIZE - 1));
    const coordinate = (log2Temperature - 13) / 2;
    if (coordinate >= -1.25 && coordinate <= 1.25) samples.push([coordinate, table[i * 4], table[i * 4 + 1], table[i * 4 + 2], table[i * 4 + 3]]);
  }
  const fitChannel = (channel) => {
    const normal = Array.from({ length: 4 }, () => new Float64Array(5));
    for (const sample of samples) {
      const powers = [1, sample[0], sample[0] ** 2, sample[0] ** 3];
      for (let row = 0; row < 4; row++) {
        for (let column = 0; column < 4; column++) normal[row][column] += powers[row] * powers[column];
        normal[row][4] += powers[row] * sample[channel];
      }
    }
    for (let pivot = 0; pivot < 4; pivot++) {
      for (let row = pivot + 1; row < 4; row++) {
        const factor = normal[row][pivot] / normal[pivot][pivot];
        for (let column = pivot; column < 5; column++) normal[row][column] -= factor * normal[pivot][column];
      }
    }
    const solution = new Array(4).fill(0);
    for (let row = 3; row >= 0; row--) {
      let value = normal[row][4];
      for (let column = row + 1; column < 4; column++) value -= normal[row][column] * solution[column];
      solution[row] = value / normal[row][row];
    }
    return solution;
  };
  return { red: fitChannel(1), green: fitChannel(2), blue: fitChannel(3), logLuminance: fitChannel(4) };
}

const STAR_COLOR_FIT = fitStarColorPolynomials(buildBlackbodyTable());

const STAR_LAYERS = [
  { cellsPerFace: 5, presence: 0.5, bandPresenceGain: 0, brightestMagnitude: -1.5, faintestMagnitude: 1.0, haloRadiusPixels: 9, haloFraction: 0.12 },
  { cellsPerFace: 16, presence: 0.5, bandPresenceGain: 0, brightestMagnitude: 1.0, faintestMagnitude: 3.5, haloRadiusPixels: 5, haloFraction: 0.1 },
  { cellsPerFace: 50, presence: 0.4, bandPresenceGain: 0.4, brightestMagnitude: 3.5, faintestMagnitude: 6.0, haloRadiusPixels: STAR_PSF_RADIUS_PIXELS, haloFraction: 0 },
  { cellsPerFace: 158, presence: 0.3, bandPresenceGain: 0.6, brightestMagnitude: 6.0, faintestMagnitude: 8.5, haloRadiusPixels: STAR_PSF_RADIUS_PIXELS, haloFraction: 0 },
  { cellsPerFace: 500, presence: 0.0, bandPresenceGain: 0.85, brightestMagnitude: 8.5, faintestMagnitude: 11.0, haloRadiusPixels: STAR_PSF_RADIUS_PIXELS, haloFraction: 0 },
].map((layer) => ({
  haloRadiusPixels: layer.haloRadiusPixels,
  haloFraction: layer.haloFraction,
  cellsPerWarpedUnit: layer.cellsPerFace / 2,
  presence: layer.presence,
  bandPresenceGain: layer.bandPresenceGain,
  inverseFluxBrightest: Math.pow(10, 0.4 * layer.brightestMagnitude),
  inverseFluxFaintest: Math.pow(10, 0.4 * layer.faintestMagnitude),
  fluxPerCellAtMagnitudeZero: STAR_FLUX_AT_MAGNITUDE_ZERO * 6 * layer.cellsPerFace * layer.cellsPerFace / (4 * Math.PI),
}));

function horizonRadius(spin) {
  return 1 + Math.sqrt(1 - spin * spin);
}

function iscoRadius(spin) {
  const z1 = 1 + Math.cbrt(1 - spin * spin) * (Math.cbrt(1 + spin) + Math.cbrt(1 - spin));
  const z2 = Math.sqrt(3 * spin * spin + z1 * z1);
  return 3 + z2 - Math.sqrt((3 - z1) * (3 + z1 + 2 * z2));
}

function pageThorneDiskModel(spin) {
  const a = Math.min(Math.max(spin, 1e-4), 0.9985);
  const innerRadius = iscoRadius(a);
  const x0 = Math.sqrt(innerRadius);
  const third = Math.acos(a) / 3;
  const x1 = 2 * Math.cos(third - Math.PI / 3);
  const x2 = 2 * Math.cos(third + Math.PI / 3);
  const x3 = -2 * Math.cos(third);
  const weight1 = (3 * (x1 - a) ** 2) / (x1 * (x1 - x2) * (x1 - x3));
  const weight2 = (3 * (x2 - a) ** 2) / (x2 * (x2 - x1) * (x2 - x3));
  const weight3 = (3 * (x3 - a) ** 2) / (x3 * (x3 - x1) * (x3 - x2));
  const flux = (radius) => {
    const x = Math.sqrt(radius);
    if (x <= x0) return 0;
    const bracket = x - x0 - 1.5 * a * Math.log(x / x0)
      - weight1 * Math.log((x - x1) / (x0 - x1))
      - weight2 * Math.log((x - x2) / (x0 - x2))
      - weight3 * Math.log((x - x3) / (x0 - x3));
    return Math.max(bracket, 0) / (x ** 4 * (x ** 3 - 3 * x + 2 * a));
  };
  let maxFlux = 0;
  let peakRadius = innerRadius;
  for (let i = 1; i <= 6000; i++) {
    const radius = innerRadius * Math.pow(40, i / 6000);
    const value = flux(radius);
    if (value > maxFlux) { maxFlux = value; peakRadius = radius; }
  }
  return {
    spin: a, innerRadius, peakRadius, maxFlux, flux,
    x0, x1, x2, x3, weight1, weight2, weight3,
    logX0: Math.log(x0), logOffset1: Math.log(x0 - x1), logOffset2: Math.log(x0 - x2), logOffset3: Math.log(x0 - x3),
  };
}

function piecewiseGaussian(x, mean, sigmaBelow, sigmaAbove) {
  const t = (x - mean) / (x < mean ? sigmaBelow : sigmaAbove);
  return Math.exp(-0.5 * t * t);
}

function cieColorMatching(wavelengthNm) {
  return [
    1.056 * piecewiseGaussian(wavelengthNm, 599.8, 37.9, 31.0) + 0.362 * piecewiseGaussian(wavelengthNm, 442.0, 16.0, 26.7) - 0.065 * piecewiseGaussian(wavelengthNm, 501.1, 20.4, 26.2),
    0.821 * piecewiseGaussian(wavelengthNm, 568.8, 46.9, 40.5) + 0.286 * piecewiseGaussian(wavelengthNm, 530.9, 16.3, 31.1),
    1.217 * piecewiseGaussian(wavelengthNm, 437.0, 11.8, 36.0) + 0.681 * piecewiseGaussian(wavelengthNm, 459.0, 26.0, 13.8),
  ];
}

function blackbodyXyz(temperature) {
  const xyz = [0, 0, 0];
  for (let wavelengthNm = 360; wavelengthNm <= 830; wavelengthNm += 2) {
    const wavelength = wavelengthNm * 1e-9;
    const exponent = 1.4387769e-2 / (wavelength * temperature);
    if (exponent > 700) continue;
    const spectralRadiance = 1 / (wavelength ** 5 * Math.expm1(exponent));
    const matching = cieColorMatching(wavelengthNm);
    for (let channel = 0; channel < 3; channel++) xyz[channel] += spectralRadiance * matching[channel];
  }
  return xyz;
}

function xyzToLinearSrgb([x, y, z]) {
  return [
    3.2406 * x - 1.5372 * y - 0.4986 * z,
    -0.9689 * x + 1.8758 * y + 0.0415 * z,
    0.0557 * x - 0.2040 * y + 1.0570 * z,
  ];
}

function buildBlackbodyTable() {
  const table = new Float32Array(BLACKBODY_TABLE_SIZE * 4);
  const referenceLuminance = blackbodyXyz(6500)[1];
  for (let i = 0; i < BLACKBODY_TABLE_SIZE; i++) {
    const temperature = 2 ** (BLACKBODY_LOG2_MIN + (BLACKBODY_LOG2_MAX - BLACKBODY_LOG2_MIN) * (i / (BLACKBODY_TABLE_SIZE - 1)));
    const xyz = blackbodyXyz(temperature);
    const luminance = xyz[1];
    const chromaticity = luminance > 0 ? xyzToLinearSrgb([xyz[0] / luminance, 1, xyz[2] / luminance]).map((v) => Math.max(v, 0)) : [1, 0, 0];
    const clampedLuminance = 0.2126 * chromaticity[0] + 0.7152 * chromaticity[1] + 0.0722 * chromaticity[2];
    table.set([
      chromaticity[0] / clampedLuminance,
      chromaticity[1] / clampedLuminance,
      chromaticity[2] / clampedLuminance,
      Math.log2(Math.max(luminance / referenceLuminance, 1e-37)),
    ], i * 4);
  }
  return table;
}

function blackbodyCssColor(table, temperature) {
  const position = (Math.log2(temperature) - BLACKBODY_LOG2_MIN) / (BLACKBODY_LOG2_MAX - BLACKBODY_LOG2_MIN) * (BLACKBODY_TABLE_SIZE - 1);
  const index = Math.min(Math.max(Math.round(position), 0), BLACKBODY_TABLE_SIZE - 1);
  const rgb = [table[index * 4], table[index * 4 + 1], table[index * 4 + 2]];
  const peak = Math.max(...rgb);
  const encode = (v) => {
    const linear = Math.min(Math.max(v / peak, 0), 1);
    return Math.round(255 * (linear <= 0.0031308 ? 12.92 * linear : 1.055 * Math.pow(linear, 1 / 2.4) - 0.055));
  };
  return `rgb(${encode(rgb[0])}, ${encode(rgb[1])}, ${encode(rgb[2])})`;
}

function layoutUniformStruct(structName, fields) {
  const typeLayout = { f32: [4, 4], vec2f: [8, 8], vec3f: [12, 16], vec4f: [16, 16] };
  const offsets = {};
  const members = [];
  let byteOffset = 0;
  for (const [name, type] of fields) {
    const [size, alignment] = typeLayout[type];
    byteOffset = Math.ceil(byteOffset / alignment) * alignment;
    offsets[name] = byteOffset / 4;
    byteOffset += size;
    members.push(`  ${name}: ${type},`);
  }
  const byteSize = Math.ceil(byteOffset / 16) * 16;
  return { offsets, byteSize, floatCount: byteSize / 4, wgsl: `struct ${structName} {\n${members.join('\n')}\n}\n` };
}

const WGSL_SHARED = `
${frameLayout.wgsl}
const PI: f32 = 3.14159265358979;
const TAU: f32 = 6.28318530717959;

fn hash32(value: u32) -> u32 {
  let state = value * 747796405u + 2891336453u;
  let word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
  return (word >> 22u) ^ word;
}

fn hashToUnit(value: u32) -> f32 {
  return f32(hash32(value) >> 8u) * (1.0 / 16777216.0);
}

fn latticeGradient(cell: vec3i) -> vec3f {
  let seed = hash32((bitcast<u32>(cell.x) * 0x8da6b343u) ^ (bitcast<u32>(cell.y) * 0xd8163841u) ^ (bitcast<u32>(cell.z) * 0xcb1ab31fu));
  return vec3f(f32(seed & 1023u), f32((seed >> 10u) & 1023u), f32((seed >> 20u) & 1023u)) * (2.0 / 1023.0) - 1.0;
}

fn gradientNoise(position: vec3f) -> f32 {
  let cellFloor = floor(position);
  let local = position - cellFloor;
  let cell = vec3i(cellFloor);
  let fade = local * local * local * (local * (local * 6.0 - 15.0) + 10.0);
  let n000 = dot(latticeGradient(cell), local);
  let n100 = dot(latticeGradient(cell + vec3i(1, 0, 0)), local - vec3f(1.0, 0.0, 0.0));
  let n010 = dot(latticeGradient(cell + vec3i(0, 1, 0)), local - vec3f(0.0, 1.0, 0.0));
  let n110 = dot(latticeGradient(cell + vec3i(1, 1, 0)), local - vec3f(1.0, 1.0, 0.0));
  let n001 = dot(latticeGradient(cell + vec3i(0, 0, 1)), local - vec3f(0.0, 0.0, 1.0));
  let n101 = dot(latticeGradient(cell + vec3i(1, 0, 1)), local - vec3f(1.0, 0.0, 1.0));
  let n011 = dot(latticeGradient(cell + vec3i(0, 1, 1)), local - vec3f(0.0, 1.0, 1.0));
  let n111 = dot(latticeGradient(cell + vec3i(1, 1, 1)), local - vec3f(1.0, 1.0, 1.0));
  let nearFace = mix(mix(n000, n100, fade.x), mix(n010, n110, fade.x), fade.y);
  let farFace = mix(mix(n001, n101, fade.x), mix(n011, n111, fade.x), fade.y);
  return mix(nearFace, farFace, fade.z);
}

fn luminance(color: vec3f) -> f32 {
  return dot(color, vec3f(0.2126, 0.7152, 0.0722));
}

@vertex fn fullscreenVertex(@builtin(vertex_index) index: u32) -> @builtin(position) vec4f {
  let corner = vec2f(f32((index << 1u) & 2u), f32(index & 2u));
  return vec4f(corner * 2.0 - 1.0, 0.0, 1.0);
}
`;

const WGSL_BLACKBODY = `
fn blackbodyEntry(index: i32) -> vec4f {
  return textureLoad(blackbodyTable, vec2i(clamp(index, 0, BLACKBODY_TABLE_SIZE - 1), 0), 0);
}

fn blackbodyLookup(temperature: f32) -> vec4f {
  let position = (log2(max(temperature, 1.0)) - BLACKBODY_LOG2_MIN) / (BLACKBODY_LOG2_MAX - BLACKBODY_LOG2_MIN) * f32(BLACKBODY_TABLE_SIZE - 1);
  let index = i32(floor(position));
  return mix(blackbodyEntry(index), blackbodyEntry(index + 1), clamp(position - floor(position), 0.0, 1.0));
}

fn blackbodyRadiance(temperature: f32) -> vec3f {
  let entry = blackbodyLookup(temperature);
  return entry.rgb * exp2(entry.a);
}

fn blackbodyChromaticity(temperature: f32) -> vec3f {
  return blackbodyLookup(temperature).rgb;
}

fn redshiftedColorPerUnitLuminance(restTemperature: f32, redshift: f32) -> vec3f {
  let rest = blackbodyLookup(restTemperature);
  let observed = blackbodyLookup(restTemperature * redshift);
  return observed.rgb * exp2(observed.a - rest.a);
}
`;

const WGSL_DISK_NOISE = `
struct NoiseTarget {
  size: vec2f,
  unused: vec2f,
}
@group(0) @binding(0) var<uniform> noiseTarget: NoiseTarget;

fn periodicGradient(cell: vec2i, period: vec2i, seed: u32) -> vec2f {
  let wrapped = ((cell % period) + period) % period;
  let hashed = hash32((bitcast<u32>(wrapped.x) * 0x8da6b343u) ^ (bitcast<u32>(wrapped.y) * 0xd8163841u) ^ (seed * 0xcb1ab31fu));
  let angle = f32(hashed >> 8u) * (TAU / 16777216.0);
  return vec2f(cos(angle), sin(angle));
}

fn periodicNoise(position: vec2f, period: vec2i, seed: u32) -> f32 {
  let cellFloor = floor(position);
  let local = position - cellFloor;
  let cell = vec2i(cellFloor);
  let fade = local * local * local * (local * (local * 6.0 - 15.0) + 10.0);
  let a = dot(periodicGradient(cell, period, seed), local);
  let b = dot(periodicGradient(cell + vec2i(1, 0), period, seed), local - vec2f(1.0, 0.0));
  let c = dot(periodicGradient(cell + vec2i(0, 1), period, seed), local - vec2f(0.0, 1.0));
  let d = dot(periodicGradient(cell + vec2i(1, 1), period, seed), local - vec2f(1.0, 1.0));
  return 1.414 * mix(mix(a, b, fade.x), mix(c, d, fade.x), fade.y);
}

fn periodicFbm(uv: vec2f, basePeriod: vec2i, octaves: i32, seed: u32, gain: f32) -> f32 {
  var sum = 0.0;
  var amplitude = 0.5;
  var period = basePeriod;
  for (var octave = 0; octave < octaves; octave++) {
    sum += amplitude * periodicNoise(uv * vec2f(period), period, seed + u32(octave) * 7919u);
    period = period * 2;
    amplitude *= gain;
  }
  return sum;
}

@fragment fn diskNoiseFragment(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
  let uv = fragCoord.xy / noiseTarget.size;
  let warp = vec2f(periodicFbm(uv, vec2i(4, 3), 4, 11u, 0.5), periodicFbm(uv, vec2i(4, 3), 4, 23u, 0.5));
  let warpedUv = uv + warp * vec2f(0.05, 0.09);
  let turbulence = periodicFbm(warpedUv, vec2i(16, 7), 5, 101u, 0.5);
  let streaks = periodicFbm(uv + warp * vec2f(0.02, 0.012), vec2i(3, 30), 3, 211u, 0.5);
  let detail = periodicFbm(warpedUv, vec2i(48, 12), 3, 307u, 0.5);
  let largeScale = periodicFbm(uv, vec2i(3, 2), 3, 401u, 0.5);
  return vec4f(turbulence, streaks, detail, largeScale);
}
`;

const WGSL_TRACE = `
const OUTCOME_CAPTURED: u32 = 0u;
const OUTCOME_ESCAPED: u32 = 1u;
const OUTCOME_STEP_LIMIT: u32 = 2u;
const OUTCOME_OPAQUE: u32 = 3u;
const NEAR_W: f32 = 0.12;
const FAR_W: f32 = 0.03;
const HORIZON_GAP_FRACTION: f32 = 0.5;
const SUPERSAMPLE_STEP_THRESHOLD: u32 = 45u;
const DISK_DENSITY_FLOOR: f32 = 0.35;
const DISK_SCALE_HEIGHT: f32 = 0.02;
const DISK_MIN_PATH_COSINE: f32 = 0.15;
const TURBULENCE_LIFETIME_ORBITS: f32 = 0.6;
const TURBULENCE_ZONES_PER_OCTAVE: f32 = 2.0;
const TURBULENCE_SPIRAL_PITCH: f32 = 1.6;
const TURBULENCE_RADIAL_SCALE: f32 = 1.0;
const TURBULENCE_TEXTURE_WIDTH: f32 = ${DISK_NOISE_WIDTH}.0;
const TURBULENCE_TEXTURE_HEIGHT: f32 = ${DISK_NOISE_HEIGHT}.0;
const FRAME_DRAG_STEP_ANGLE: f32 = 0.25;

struct RayConstants {
  energy: f32,
  angularMomentum: f32,
  radialC0: f32,
  radialC1: f32,
  radialC2: f32,
  sphereSpeedSquared: f32,
  spinEnergySquared: f32,
  spinShift: f32,
}

struct RayState {
  w: f32,
  dw: f32,
  sphere: vec3f,
  sphereVelocity: vec3f,
  frameDragAngle: f32,
  coordinateTime: f32,
  regularTimeIncrement: f32,
}

struct RayRates {
  ddw: f32,
  sphereAcceleration: vec3f,
  frameDragRate: f32,
  regularTimeRate: f32,
}

struct TraceResult {
  outcome: u32,
  steps: u32,
  crossings: u32,
  skyDirection: vec3f,
  skyRedshift: f32,
  emission: vec3f,
  transmittance: f32,
  firstCrossing: vec4f,
}

fn makeRayConstants(local: vec3f) -> RayConstants {
  let a = frame.spin;
  let energy = -frame.cameraLapse + frame.cameraFrameDragVelocity * local.z;
  let angularMomentum = frame.cameraCylindricalRadius * local.z;
  let thetaRate = frame.cameraSqrtSigma * local.y;
  let carterQ = thetaRate * thetaRate + frame.cameraCosThetaSquared * (frame.cameraAOverSigma * local.z * local.z - a * a * energy * energy);
  let shiftedMomentum = angularMomentum - a * energy;
  let kerrK = carterQ + shiftedMomentum * shiftedMomentum;
  let spinShift = -a * shiftedMomentum;
  var constants: RayConstants;
  constants.energy = energy;
  constants.angularMomentum = angularMomentum;
  constants.radialC0 = 2.0 * energy * spinShift - kerrK;
  constants.radialC1 = 3.0 * kerrK;
  constants.radialC2 = 2.0 * (spinShift * spinShift - a * a * kerrK);
  constants.sphereSpeedSquared = carterQ + angularMomentum * angularMomentum;
  constants.spinEnergySquared = a * a * energy * energy;
  constants.spinShift = spinShift;
  return constants;
}

fn makeInitialState(local: vec3f) -> RayState {
  var state: RayState;
  state.w = frame.cameraInverseRadius;
  state.dw = -frame.cameraRadialRateScale * local.x;
  state.sphere = frame.cameraSphereUnit;
  state.sphereVelocity = (frame.cameraSqrtSigma * local.y) * frame.cameraSphereThetaHat + (frame.cameraAzimuthalScale * local.z) * frame.cameraPhiHat;
  state.frameDragAngle = 0.0;
  state.coordinateTime = 0.0;
  state.regularTimeIncrement = 0.0;
  return state;
}

fn rayRates(constants: RayConstants, w: f32, sphere: vec3f) -> RayRates {
  let a = frame.spin;
  let u = sphere.z;
  var rates: RayRates;
  rates.ddw = w * (constants.radialC0 + w * (constants.radialC1 + w * constants.radialC2));
  let pull = -constants.sphereSpeedSquared - 2.0 * constants.spinEnergySquared * u * u;
  rates.sphereAcceleration = pull * sphere + vec3f(0.0, 0.0, constants.spinEnergySquared * u);
  let inverseDelta = 1.0 / max(1.0 - 2.0 * w + a * a * w * w, 1e-5);
  rates.frameDragRate = a * w * (2.0 * constants.energy - a * constants.angularMomentum * w) * inverseDelta;
  rates.regularTimeRate = (2.0 * constants.energy * (2.0 - a * a * w) + constants.spinShift * (1.0 + a * a * w * w)) * inverseDelta
    + a * (constants.angularMomentum - a * constants.energy * (1.0 - u * u));
  return rates;
}

fn singularTimeIntegral(energy: f32, h: f32, w0: f32, w1: f32) -> f32 {
  let safeW1 = max(w1, 1e-6);
  let relativeChange = (safeW1 - w0) / w0;
  var logRatioOverDifference = log(safeW1 / w0) / (safeW1 - w0);
  if (abs(relativeChange) < 1e-2) {
    logRatioOverDifference = (1.0 - relativeChange * 0.5 + relativeChange * relativeChange * (1.0 / 3.0)) / w0;
  }
  return energy * h * (1.0 / (w0 * safeW1) + 2.0 * logRatioOverDifference);
}

fn advanceRay(constants: RayConstants, state: RayState, h: f32) -> RayState {
  let first = rayRates(constants, state.w, state.sphere);
  let halfStep = 0.5 * h;
  let stepSquaredOver8 = 0.125 * h * h;
  let second = rayRates(constants,
    state.w + halfStep * state.dw + stepSquaredOver8 * first.ddw,
    state.sphere + halfStep * state.sphereVelocity + stepSquaredOver8 * first.sphereAcceleration);
  let stepSquaredOver2 = 0.5 * h * h;
  let third = rayRates(constants,
    state.w + h * state.dw + stepSquaredOver2 * second.ddw,
    state.sphere + h * state.sphereVelocity + stepSquaredOver2 * second.sphereAcceleration);
  let stepSquaredOver6 = h * h * (1.0 / 6.0);
  let stepOver6 = h * (1.0 / 6.0);
  var next: RayState;
  next.w = state.w + h * state.dw + stepSquaredOver6 * (first.ddw + 2.0 * second.ddw);
  next.dw = state.dw + stepOver6 * (first.ddw + 4.0 * second.ddw + third.ddw);
  let sphere = state.sphere + h * state.sphereVelocity + stepSquaredOver6 * (first.sphereAcceleration + 2.0 * second.sphereAcceleration);
  let sphereVelocity = state.sphereVelocity + stepOver6 * (first.sphereAcceleration + 4.0 * second.sphereAcceleration + third.sphereAcceleration);
  next.sphere = normalize(sphere);
  next.sphereVelocity = sphereVelocity - dot(sphereVelocity, next.sphere) * next.sphere;
  next.frameDragAngle = state.frameDragAngle + stepOver6 * (first.frameDragRate + 4.0 * second.frameDragRate + third.frameDragRate);
  next.regularTimeIncrement = stepOver6 * (first.regularTimeRate + 4.0 * second.regularTimeRate + third.regularTimeRate);
  next.coordinateTime = state.coordinateTime + next.regularTimeIncrement + singularTimeIntegral(constants.energy, h, state.w, next.w);
  return next;
}

fn stepSize(constants: RayConstants, state: RayState, angleScale: f32) -> f32 {
  let a = frame.spin;
  let u = state.sphere.z;
  let sphereSpeed = sqrt(max(constants.sphereSpeedSquared + constants.spinEnergySquared * u * u, 0.0));
  let nearness = clamp((state.w - FAR_W) / (NEAR_W - FAR_W), 0.0, 1.0);
  let angle = mix(frame.stepAngleFar, frame.stepAngleNear, nearness) * angleScale;
  let horizonApproach = max(state.dw, 0.0) / (HORIZON_GAP_FRACTION * max(frame.horizonW - state.w, 1e-4));
  let delta = 1.0 - 2.0 * state.w + a * a * state.w * state.w;
  let frameDragRate = abs(a * state.w * (2.0 * constants.energy - a * constants.angularMomentum * state.w)) / max(delta, 1e-4);
  let diskZoneDrag = select(0.0, frameDragRate / FRAME_DRAG_STEP_ANGLE, state.w < frame.diskZoneW);
  let rate = max(max(sphereSpeed, abs(state.dw) * angle / frame.stepRadialSpan), max(max(horizonApproach, diskZoneDrag), 1e-6) * angle);
  return angle / max(rate, 1e-6);
}

fn hermiteInterpolate(p0: f32, d0: f32, p1: f32, d1: f32, h: f32, f: f32) -> f32 {
  let f2 = f * f;
  let f3 = f2 * f;
  return (2.0 * f3 - 3.0 * f2 + 1.0) * p0 + (f3 - 2.0 * f2 + f) * h * d0 + (3.0 * f2 - 2.0 * f3) * p1 + (f3 - f2) * h * d1;
}

fn rotateAboutSpinAxis(v: vec3f, angle: f32) -> vec3f {
  let c = cos(angle);
  let s = sin(angle);
  return vec3f(v.x * c - v.y * s, v.x * s + v.y * c, v.z);
}

fn diskFlux(radius: f32) -> f32 {
  let x = sqrt(radius);
  let bracket = x - frame.fluxX0 - 1.5 * frame.spin * (log(x) - frame.fluxLogX0)
    - frame.fluxWeight1 * (log(x - frame.fluxX1) - frame.fluxLogOffset1)
    - frame.fluxWeight2 * (log(x - frame.fluxX2) - frame.fluxLogOffset2)
    - frame.fluxWeight3 * (log(x - frame.fluxX3) - frame.fluxLogOffset3);
  let x2 = x * x;
  return max(bracket, 0.0) / (x2 * x2 * (x2 * x - 3.0 * x + 2.0 * frame.spin));
}

fn diskOpacityProfile(radius: f32) -> f32 {
  let inner = frame.diskInnerRadius;
  let innerTaper = smoothstep(inner, inner * 1.3, radius);
  let outerTaper = 1.0 - smoothstep(frame.diskOuterRadius * 0.45, frame.diskOuterRadius, radius);
  return innerTaper * outerTaper * pow(inner * 2.5 / max(radius, inner * 2.5), 0.9);
}

fn generationOffset(generation: f32, layer: i32) -> vec2f {
  let seed = hash32(bitcast<u32>(i32(generation)) * 0x9e3779b1u + u32(layer) * 0x7f4a7c15u);
  return vec2f(f32(seed & 0xffffu), f32(seed >> 16u)) * (1.0 / 65536.0);
}

fn diskTurbulence(radius: f32, azimuth: f32, time: f32, detailLevel: f32) -> vec2f {
  let logRadius = log(radius);
  let orbitalRate = 1.0 / (radius * sqrt(radius) + frame.spin);
  let zoneCoordinate = log2(radius / frame.diskInnerRadius) * TURBULENCE_ZONES_PER_OCTAVE;
  let zoneBase = floor(zoneCoordinate);
  let zoneBlend = zoneCoordinate - zoneBase;
  var blended = vec4f(0.0);
  var weightSquares = 0.0;
  for (var zone = 0; zone < 2; zone++) {
    let zoneIndex = zoneBase + f32(zone);
    let zoneWeight = select(1.0 - zoneBlend, zoneBlend, zone == 1);
    let zoneRadius = frame.diskInnerRadius * exp2(zoneIndex / TURBULENCE_ZONES_PER_OCTAVE);
    let naturalLifetime = TAU * TURBULENCE_LIFETIME_ORBITS * (zoneRadius * sqrt(zoneRadius) + frame.spin);
    let looping = frame.turbulenceLoopPeriod > 0.0;
    let cyclesPerLoop = max(round(frame.turbulenceLoopPeriod / naturalLifetime), 1.0);
    let lifetime = select(naturalLifetime, frame.turbulenceLoopPeriod / cyclesPerLoop, looping);
    let zonePhase = time / lifetime + zoneIndex * 0.381966;
    for (var layer = 0; layer < 2; layer++) {
      let layerPhase = zonePhase + 0.5 * f32(layer);
      let age = fract(layerPhase);
      let weight = zoneWeight * (1.0 - abs(2.0 * age - 1.0));
      let advectedAzimuth = azimuth - orbitalRate * age * lifetime + TURBULENCE_SPIRAL_PITCH * logRadius;
      let generation = select(floor(layerPhase), floor(layerPhase) - cyclesPerLoop * floor(floor(layerPhase) / cyclesPerLoop), looping);
      let coordinates = vec2f(advectedAzimuth * (1.0 / TAU), logRadius * TURBULENCE_RADIAL_SCALE) + generationOffset(generation, layer + 2 * i32(zoneIndex));
      blended += weight * textureSampleLevel(diskNoiseTexture, repeatSampler, coordinates, detailLevel);
      weightSquares += weight * weight;
    }
  }
  let fields = blended * inverseSqrt(max(weightSquares, 0.1));
  let structure = 2.2 * fields.x + 0.12 * fields.y + 0.45 * fields.z + 1.2 * fields.w;
  return vec2f(exp(structure), 0.9 * fields.x + 0.35 * fields.z + 0.5 * fields.w);
}

fn shadeDiskCrossing(constants: RayConstants, radius: f32, azimuth: f32, emissionTime: f32, normalRate: f32, crossingW: f32) -> vec4f {
  let a = frame.spin;
  let sqrtRadius = sqrt(radius);
  let radiusToThreeHalves = radius * sqrtRadius;
  let orbitalRate = 1.0 / (radiusToThreeHalves + a);
  let timeDilation = (radiusToThreeHalves + a) / (sqrt(sqrtRadius) * sqrtRadius * sqrt(max(radiusToThreeHalves - 3.0 * sqrtRadius + 2.0 * a, 1e-6)));
  let redshift = 1.0 / max(timeDilation * (orbitalRate * constants.angularMomentum - constants.energy), 1e-4);
  let emittedTemperature = frame.diskPeakTemperature * pow(max(diskFlux(radius) * frame.inverseMaxFlux, 0.0), 0.25);
  let emissionCosine = clamp(normalRate * crossingW * redshift, 0.04, 1.0);
  let slabCosine = max(emissionCosine, DISK_MIN_PATH_COSINE);
  let pixelFootprint = frame.tanHalfFovY * 2.0 / frame.internalSize.y * max(abs(emissionTime), 1.0) * inverseSqrt(slabCosine);
  let slabSmear = 2.0 * DISK_SCALE_HEIGHT * radius * sqrt(max(1.0 - slabCosine * slabCosine, 0.0)) / slabCosine;
  let footprint = max(pixelFootprint, slabSmear);
  let texelsPerUnitLength = max(TURBULENCE_TEXTURE_WIDTH / (TAU * radius), TURBULENCE_TEXTURE_HEIGHT * TURBULENCE_RADIAL_SCALE / radius);
  let detailLevel = max(log2(footprint * texelsPerUnitLength), 0.0);
  let turbulence = diskTurbulence(radius, azimuth, frame.diskTime + emissionTime, detailLevel);
  let localTemperature = emittedTemperature * clamp(1.0 + 0.12 * turbulence.y, 0.75, 1.3);
  let opticalDepth = frame.diskOpacity * diskOpacityProfile(radius) * (DISK_DENSITY_FLOOR + turbulence.x);
  let transmission = exp(-opticalDepth / slabCosine);
  let limbDarkening = mix(1.0, (1.0 + 2.06 * emissionCosine) / 2.3733, 1.0 - exp(-opticalDepth));
  var radiance: vec3f;
  if (frame.cinematicColor > 0.5) {
    let warmTemperature = emittedTemperature * 0.62 * mix(1.0, redshift, 0.15);
    let brightness = luminance(blackbodyRadiance(localTemperature)) * pow(redshift, 1.4);
    radiance = blackbodyChromaticity(warmTemperature) * brightness * 1.15;
  } else {
    radiance = blackbodyRadiance(localTemperature * redshift);
  }
  return vec4f(radiance * ((1.0 - transmission) * limbDarkening), transmission);
}

fn traceRay(local: vec3f, shadeDisk: bool, angleScale: f32) -> TraceResult {
  let constants = makeRayConstants(local);
  var state = makeInitialState(local);
  var result: TraceResult;
  result.outcome = OUTCOME_STEP_LIMIT;
  result.steps = 0u;
  result.crossings = 0u;
  result.skyDirection = vec3f(0.0);
  result.skyRedshift = 1.0 / max(-constants.energy, 1e-3);
  result.emission = vec3f(0.0);
  result.transmittance = 1.0;
  result.firstCrossing = vec4f(0.0);
  let stepLimit = u32(frame.maxSteps);
  for (var stepIndex = 0u; stepIndex < stepLimit; stepIndex++) {
    let h = stepSize(constants, state, angleScale);
    let next = advanceRay(constants, state, h);
    result.steps = stepIndex + 1u;
    if ((state.sphere.z > 0.0) != (next.sphere.z > 0.0)) {
      let fraction = state.sphere.z / (state.sphere.z - next.sphere.z);
      let crossingW = hermiteInterpolate(state.w, state.dw, next.w, next.dw, h, fraction);
      let radius = 1.0 / crossingW;
      if (radius > frame.diskInnerRadius && radius < frame.diskOuterRadius) {
        let planar = mix(state.sphere.xy, next.sphere.xy, fraction);
        let azimuth = atan2(planar.y, planar.x) + mix(state.frameDragAngle, next.frameDragAngle, fraction);
        let emissionTime = state.coordinateTime + fraction * next.regularTimeIncrement + singularTimeIntegral(constants.energy, fraction * h, state.w, crossingW);
        let normalRate = abs(mix(state.sphereVelocity.z, next.sphereVelocity.z, fraction));
        if (result.crossings == 0u) {
          result.firstCrossing = vec4f(radius, azimuth, emissionTime, normalRate * crossingW);
        }
        result.crossings += 1u;
        if (shadeDisk) {
          let crossingSample = shadeDiskCrossing(constants, radius, azimuth, emissionTime, normalRate, crossingW);
          result.emission += result.transmittance * crossingSample.rgb;
          result.transmittance *= crossingSample.a;
          if (result.transmittance < 0.004) {
            result.outcome = OUTCOME_OPAQUE;
            break;
          }
        }
      }
    }
    if (next.w <= 0.0) {
      let fraction = state.w / (state.w - next.w);
      let sphere = normalize(mix(state.sphere, next.sphere, fraction));
      result.skyDirection = rotateAboutSpinAxis(sphere, mix(state.frameDragAngle, next.frameDragAngle, fraction));
      result.outcome = OUTCOME_ESCAPED;
      break;
    }
    if (next.w >= frame.horizonStopW) {
      result.outcome = OUTCOME_CAPTURED;
      break;
    }
    state = next;
  }
  if (result.outcome == OUTCOME_STEP_LIMIT && state.dw < 0.0 && state.w < 0.06) {
    result.skyDirection = rotateAboutSpinAxis(state.sphere, state.frameDragAngle);
    result.outcome = OUTCOME_ESCAPED;
  }
  return result;
}

fn heatColor(value: f32) -> vec3f {
  let t = clamp(value, 0.0, 1.0);
  return clamp(vec3f(1.5 * t, 2.0 * t - 0.5, 4.0 * t * (1.0 - t)) + vec3f(0.0, 0.0, 0.15), vec3f(0.0), vec3f(1.0)) * 4.0;
}

struct TraceTargets {
  @location(0) disk: vec4f,
  @location(1) sky: vec4f,
}

fn localRayDirection(pixel: vec2f) -> vec3f {
  let ndc = vec2f(pixel.x / frame.internalSize.x * 2.0 - 1.0, 1.0 - pixel.y / frame.internalSize.y * 2.0);
  let directionBh = normalize(frame.cameraForward
    + ((ndc.x - frame.viewCenterShiftX) * frame.aspectRatio * frame.tanHalfFovY) * frame.cameraRight
    + (ndc.y * frame.tanHalfFovY) * frame.cameraUp);
  return vec3f(dot(directionBh, frame.cameraRadialHat), dot(directionBh, frame.cameraPolarHat), dot(directionBh, frame.cameraPhiHat));
}

fn supersampleOffset(index: u32) -> vec2f {
  let corner = vec2f(select(-0.375, 0.125, (index & 1u) != 0u), select(-0.125, 0.375, (index & 2u) != 0u));
  return select(corner, vec2f(-corner.y, corner.x), (index & 1u) != (index >> 1u));
}

@fragment fn traceFragment(@builtin(position) fragCoord: vec4f) -> TraceTargets {
  let result = traceRay(localRayDirection(fragCoord.xy), true, 1.0);
  var targets: TraceTargets;
  let escaped = result.outcome == OUTCOME_ESCAPED;
  var emission = result.emission;
  var visibility = select(0.0, result.transmittance, escaped);
  if (result.steps > SUPERSAMPLE_STEP_THRESHOLD) {
    for (var sampleIndex = 0u; sampleIndex < 4u; sampleIndex++) {
      let extra = traceRay(localRayDirection(fragCoord.xy + supersampleOffset(sampleIndex)), true, 1.0);
      emission += extra.emission;
      visibility += select(0.0, extra.transmittance, extra.outcome == OUTCOME_ESCAPED);
    }
    emission *= 0.2;
    visibility *= 0.2;
  }
  targets.disk = vec4f(emission, visibility);
  let worldDirection = frame.worldFromBhX * result.skyDirection.x + frame.worldFromBhY * result.skyDirection.y + frame.worldFromBhZ * result.skyDirection.z;
  targets.sky = select(vec4f(0.0), vec4f(worldDirection, result.skyRedshift), escaped);
  if (frame.debugView > 0.5) {
    targets.disk = vec4f(heatColor(f32(result.steps) / 160.0), 0.0);
    targets.sky = vec4f(0.0);
  }
  return targets;
}
`;

const WGSL_SELF_TEST = `
struct SelfTestRecord {
  summary: vec4f,
  sky: vec4f,
  crossing: vec4f,
}
@group(1) @binding(0) var<storage, read> selfTestDirections: array<vec4f>;
@group(1) @binding(1) var<storage, read_write> selfTestRecords: array<SelfTestRecord>;

@compute @workgroup_size(64) fn selfTestCompute(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= arrayLength(&selfTestDirections)) {
    return;
  }
  let result = traceRay(selfTestDirections[id.x].xyz, false, 1.0);
  selfTestRecords[id.x].summary = vec4f(f32(result.outcome), f32(result.steps), f32(result.crossings), result.skyRedshift);
  selfTestRecords[id.x].sky = vec4f(result.skyDirection, 0.0);
  selfTestRecords[id.x].crossing = result.firstCrossing;
}
`;

const WGSL_BLOOM = `
struct BloomStage {
  sourceTexel: vec2f,
  targetSize: vec2f,
  tapSpacing: vec2f,
  sourceUvExtent: vec2f,
  firstStage: f32,
  unusedA: f32,
  unusedB: f32,
  unusedC: f32,
}
@group(1) @binding(0) var bloomSource: texture_2d<f32>;
@group(1) @binding(1) var bloomSampler: sampler;
@group(1) @binding(2) var<uniform> stage: BloomStage;

fn bloomTap(uv: vec2f, offset: vec2f) -> vec3f {
  let position = clamp(uv + offset * stage.tapSpacing * stage.sourceTexel, 0.5 * stage.sourceTexel, stage.sourceUvExtent - 0.5 * stage.sourceTexel);
  return textureSampleLevel(bloomSource, bloomSampler, position, 0.0).rgb;
}

fn karisWeight(color: vec3f) -> f32 {
  return 1.0 / (1.0 + luminance(color));
}

@fragment fn bloomDownsample(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
  let uv = fragCoord.xy / stage.targetSize * stage.sourceUvExtent;
  let a = bloomTap(uv, vec2f(-2.0, -2.0));
  let b = bloomTap(uv, vec2f(0.0, -2.0));
  let c = bloomTap(uv, vec2f(2.0, -2.0));
  let d = bloomTap(uv, vec2f(-2.0, 0.0));
  let e = bloomTap(uv, vec2f(0.0, 0.0));
  let f = bloomTap(uv, vec2f(2.0, 0.0));
  let g = bloomTap(uv, vec2f(-2.0, 2.0));
  let h = bloomTap(uv, vec2f(0.0, 2.0));
  let i = bloomTap(uv, vec2f(2.0, 2.0));
  let j = bloomTap(uv, vec2f(-1.0, -1.0));
  let k = bloomTap(uv, vec2f(1.0, -1.0));
  let l = bloomTap(uv, vec2f(-1.0, 1.0));
  let m = bloomTap(uv, vec2f(1.0, 1.0));
  if (stage.firstStage > 0.5) {
    let center = (j + k + l + m) * 0.25;
    let topLeft = (a + b + d + e) * 0.25;
    let topRight = (b + c + e + f) * 0.25;
    let bottomLeft = (d + e + g + h) * 0.25;
    let bottomRight = (e + f + h + i) * 0.25;
    let weights = vec4f(karisWeight(topLeft), karisWeight(topRight), karisWeight(bottomLeft), karisWeight(bottomRight)) * 0.125;
    let centerWeight = karisWeight(center) * 0.5;
    let total = centerWeight + weights.x + weights.y + weights.z + weights.w;
    let color = (center * centerWeight + topLeft * weights.x + topRight * weights.y + bottomLeft * weights.z + bottomRight * weights.w) / total;
    return vec4f(color, 1.0);
  }
  let color = e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125;
  return vec4f(color, 1.0);
}

@fragment fn bloomUpsample(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
  let uv = fragCoord.xy / stage.targetSize * stage.sourceUvExtent;
  var color = bloomTap(uv, vec2f(0.0, 0.0)) * 4.0;
  color += (bloomTap(uv, vec2f(-1.0, 0.0)) + bloomTap(uv, vec2f(1.0, 0.0)) + bloomTap(uv, vec2f(0.0, -1.0)) + bloomTap(uv, vec2f(0.0, 1.0))) * 2.0;
  color += bloomTap(uv, vec2f(-1.0, -1.0)) + bloomTap(uv, vec2f(1.0, -1.0)) + bloomTap(uv, vec2f(-1.0, 1.0)) + bloomTap(uv, vec2f(1.0, 1.0));
  return vec4f(color * (1.0 / 16.0), 1.0);
}
`;

const WGSL_SKY = `
@group(1) @binding(0) var skyDirectionTexture: texture_2d<f32>;
@group(1) @binding(1) var galaxyTexture: texture_cube<f32>;
@group(1) @binding(2) var linearSampler: sampler;

const GALAXY_BAND_FULL_LUMINANCE: f32 = 0.008;
const STAR_KERNEL_NORMALIZATION: f32 = ${(4 / (Math.PI * STAR_PSF_RADIUS_PIXELS * STAR_PSF_RADIUS_PIXELS)).toFixed(6)};
const STAR_PSF_RADIUS: f32 = ${STAR_PSF_RADIUS_PIXELS.toFixed(4)};
const STAR_PSF_RADIUS_SQUARED: f32 = ${(STAR_PSF_RADIUS_PIXELS * STAR_PSF_RADIUS_PIXELS).toFixed(4)};
const STAR_COLOR_RED: vec4f = vec4f(${STAR_COLOR_FIT.red.map((c) => c.toFixed(6)).join(', ')});
const STAR_COLOR_GREEN: vec4f = vec4f(${STAR_COLOR_FIT.green.map((c) => c.toFixed(6)).join(', ')});
const STAR_COLOR_BLUE: vec4f = vec4f(${STAR_COLOR_FIT.blue.map((c) => c.toFixed(6)).join(', ')});
const STAR_LOG_LUMINANCE: vec4f = vec4f(${STAR_COLOR_FIT.logLuminance.map((c) => c.toFixed(6)).join(', ')});
const STAR_MAX_MAGNIFICATION: f32 = 64.0;
const STAR_HALO_CORE_SQUARED: f32 = ${(STAR_HALO_CORE_PIXELS * STAR_HALO_CORE_PIXELS).toFixed(4)};
const STAR_HALO_FALLOFF_POWER: f32 = ${STAR_HALO_FALLOFF_POWER.toFixed(4)};
const STAR_HALO_NORMALIZATION: f32 = ${((STAR_HALO_FALLOFF_POWER - 1) / (Math.PI * STAR_HALO_CORE_PIXELS * STAR_HALO_CORE_PIXELS)).toFixed(6)};

struct StarLayer {
  cellsPerWarpedUnit: f32,
  presence: f32,
  bandPresenceGain: f32,
  inverseFluxBrightest: f32,
  inverseFluxFaintest: f32,
  fluxPerCellAtMagnitudeZero: f32,
  haloRadius: f32,
  haloFraction: f32,
}


struct CubeFace {
  index: u32,
  normal: vec3f,
  axisU: vec3f,
  axisV: vec3f,
}

fn selectCubeFace(direction: vec3f) -> CubeFace {
  let magnitude = abs(direction);
  var face: CubeFace;
  if (magnitude.x >= magnitude.y && magnitude.x >= magnitude.z) {
    let s = select(-1.0, 1.0, direction.x > 0.0);
    face.index = select(1u, 0u, direction.x > 0.0);
    face.normal = vec3f(s, 0.0, 0.0);
    face.axisU = vec3f(0.0, 0.0, -s);
    face.axisV = vec3f(0.0, 1.0, 0.0);
  } else if (magnitude.y >= magnitude.z) {
    let s = select(-1.0, 1.0, direction.y > 0.0);
    face.index = select(3u, 2u, direction.y > 0.0);
    face.normal = vec3f(0.0, s, 0.0);
    face.axisU = vec3f(1.0, 0.0, 0.0);
    face.axisV = vec3f(0.0, 0.0, -s);
  } else {
    let s = select(-1.0, 1.0, direction.z > 0.0);
    face.index = select(5u, 4u, direction.z > 0.0);
    face.normal = vec3f(0.0, 0.0, s);
    face.axisU = vec3f(s, 0.0, 0.0);
    face.axisV = vec3f(0.0, 1.0, 0.0);
  }
  return face;
}

fn cellRandom(cell: vec2f, salt: f32) -> vec3f {
  var p = fract(vec3f(cell, salt) * vec3f(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}

fn cubicPolynomial(coefficients: vec4f, x: f32) -> f32 {
  return coefficients.x + x * (coefficients.y + x * (coefficients.z + x * coefficients.w));
}

fn starColor(temperatureCoordinate: f32, redshiftShift: f32) -> vec3f {
  let observed = clamp(temperatureCoordinate + redshiftShift, -1.2, 1.2);
  let chromaticity = max(vec3f(cubicPolynomial(STAR_COLOR_RED, observed), cubicPolynomial(STAR_COLOR_GREEN, observed), cubicPolynomial(STAR_COLOR_BLUE, observed)), vec3f(0.0));
  return chromaticity * exp2(cubicPolynomial(STAR_LOG_LUMINANCE, observed) - cubicPolynomial(STAR_LOG_LUMINANCE, temperatureCoordinate));
}

struct StarFrame {
  warped: vec2f,
  pixelsPerWarpedRowX: vec2f,
  pixelsPerWarpedRowY: vec2f,
  warpedArea: f32,
  largestStretch: f32,
  faceSalt: f32,
  redshiftShift: f32,
  bandStrength: f32,
}

fn starLayerRadiance(starFrame: StarFrame, layer: StarLayer, layerIndex: f32) -> vec3f {
  let cellsPerWarpedUnit = layer.cellsPerWarpedUnit;
  let stretchInCells = starFrame.largestStretch * cellsPerWarpedUnit;
  let resolvedWeight = 1.0 - smoothstep(0.3, 0.6, stretchInCells);
  let presence = min(layer.presence + layer.bandPresenceGain * starFrame.bandStrength, 0.95);
  var radiance = vec3f(0.0);
  if (presence <= 0.0 || resolvedWeight <= 0.0) {
    return radiance;
  }
  let cellPosition = (starFrame.warped + 1.0) * cellsPerWarpedUnit;
  let warpedPerCell = 1.0 / cellsPerWarpedUnit;
  let fluxPerPixel = resolvedWeight / (starFrame.warpedArea * cellsPerWarpedUnit * cellsPerWarpedUnit);
  let haloRadiusSquared = layer.haloRadius * layer.haloRadius;
  let coreWeight = (1.0 - layer.haloFraction) * STAR_KERNEL_NORMALIZATION;
  let haloWeight = layer.haloFraction * STAR_HALO_NORMALIZATION;
  let supportRadiusSquared = max(STAR_PSF_RADIUS_SQUARED, haloRadiusSquared);
  let cellLimit = 2.0 * cellsPerWarpedUnit;
  let singleCell = stretchInCells * sqrt(supportRadiusSquared) < 0.2;
  let baseCell = select(floor(cellPosition - 0.5), floor(cellPosition), singleCell);
  let cornerCount = select(4u, 1u, singleCell);
  let salt = starFrame.faceSalt + layerIndex * 101.0;
  for (var corner = 0u; corner < cornerCount; corner++) {
    let cell = baseCell + vec2f(f32(corner & 1u), f32(corner >> 1u));
    if (cell.x < 0.0 || cell.y < 0.0 || cell.x >= cellLimit || cell.y >= cellLimit) {
      continue;
    }
    let draw = cellRandom(cell, salt);
    if (draw.x >= presence) {
      continue;
    }
    let jitter = draw.yz * 0.6 + 0.2;
    let offsetWarped = (cell + jitter - cellPosition) * warpedPerCell;
    let offsetPixels = vec2f(dot(starFrame.pixelsPerWarpedRowX, offsetWarped), dot(starFrame.pixelsPerWarpedRowY, offsetWarped));
    let distanceSquared = dot(offsetPixels, offsetPixels);
    if (distanceSquared > supportRadiusSquared) {
      continue;
    }
    let details = cellRandom(cell + 0.5, salt + 57.0);
    let temperatureCoordinate = select(-0.63 + 0.62 * details.y, 0.17 + 0.82 * details.z, details.y > 0.86);
    let flux = layer.fluxPerCellAtMagnitudeZero / mix(layer.inverseFluxBrightest, layer.inverseFluxFaintest, details.x);
    let coreFalloff = max(1.0 - distanceSquared * (1.0 / STAR_PSF_RADIUS_SQUARED), 0.0);
    var kernel = coreWeight * coreFalloff * coreFalloff * coreFalloff;
    if (haloWeight > 0.0) {
      let haloTaper = max(1.0 - distanceSquared / haloRadiusSquared, 0.0);
      kernel += haloWeight * pow(1.0 + distanceSquared / STAR_HALO_CORE_SQUARED, -STAR_HALO_FALLOFF_POWER) * haloTaper * haloTaper;
    }
    radiance += (flux * fluxPerPixel * kernel) * starColor(temperatureCoordinate, starFrame.redshiftShift);
  }
  return radiance;
}

fn starRadiance(direction: vec3f, ddx: vec3f, ddy: vec3f, skyRedshift: f32, bandStrength: f32) -> vec3f {
  let face = selectCubeFace(direction);
  let along = dot(direction, face.normal);
  let planeU = dot(direction, face.axisU) / along;
  let planeV = dot(direction, face.axisV) / along;
  let gradientU = ((4.0 / PI) / (1.0 + planeU * planeU)) * (face.axisU - planeU * face.normal) / along;
  let gradientV = ((4.0 / PI) / (1.0 + planeV * planeV)) * (face.axisV - planeV * face.normal) / along;
  let warpedPerPixelX = vec2f(dot(gradientU, ddx), dot(gradientV, ddx));
  let warpedPerPixelY = vec2f(dot(gradientU, ddy), dot(gradientV, ddy));
  let unlensedWarpedArea = frame.skyPixelAngle * frame.skyPixelAngle * abs(dot(cross(gradientU, gradientV), direction));
  let signedArea = warpedPerPixelX.x * warpedPerPixelY.y - warpedPerPixelX.y * warpedPerPixelY.x;
  let warpedArea = max(abs(signedArea), unlensedWarpedArea / STAR_MAX_MAGNIFICATION);
  let frobenius = dot(warpedPerPixelX, warpedPerPixelX) + dot(warpedPerPixelY, warpedPerPixelY);
  let determinant = select(-warpedArea, warpedArea, signedArea >= 0.0);
  var starFrame: StarFrame;
  starFrame.warped = vec2f(atan(planeU), atan(planeV)) * (4.0 / PI);
  starFrame.pixelsPerWarpedRowX = vec2f(warpedPerPixelY.y, -warpedPerPixelY.x) / determinant;
  starFrame.pixelsPerWarpedRowY = vec2f(-warpedPerPixelX.y, warpedPerPixelX.x) / determinant;
  starFrame.warpedArea = warpedArea;
  starFrame.largestStretch = sqrt(0.5 * (frobenius + sqrt(max(frobenius * frobenius - 4.0 * signedArea * signedArea, 0.0))));
  starFrame.faceSalt = f32(face.index) * 17.0 + 3.0;
  starFrame.redshiftShift = log2(max(skyRedshift, 1e-3)) * 0.5;
  starFrame.bandStrength = bandStrength;
  var radiance = vec3f(0.0);
${STAR_LAYERS.map((layer, index) => `  radiance += starLayerRadiance(starFrame, StarLayer(${layer.cellsPerWarpedUnit.toFixed(1)}, ${layer.presence.toFixed(4)}, ${layer.bandPresenceGain.toFixed(4)}, ${layer.inverseFluxBrightest.toExponential(6)}, ${layer.inverseFluxFaintest.toExponential(6)}, ${layer.fluxPerCellAtMagnitudeZero.toExponential(6)}, ${layer.haloRadiusPixels.toFixed(4)}, ${layer.haloFraction.toFixed(4)}), ${index}.0);`).join('\n')}
  return radiance;
}

fn galaxyRadiance(direction: vec3f, ddx: vec3f, ddy: vec3f, skyRedshift: f32) -> vec3f {
  let texel = textureSampleGrad(galaxyTexture, linearSampler, direction, ddx, ddy);
  if (abs(skyRedshift - 1.0) < 1e-3) {
    return texel.rgb;
  }
  let effectiveTemperature = max(texel.a * 10000.0, 1000.0);
  let rest = blackbodyRadiance(effectiveTemperature);
  let observed = blackbodyRadiance(effectiveTemperature * skyRedshift);
  return texel.rgb * observed / max(rest, vec3f(1e-6));
}

fn skyRadiance(internalPosition: vec2f, internalPerSky: vec2f) -> vec3f {
  let texelPosition = internalPosition - 0.5;
  let baseTexel = floor(texelPosition);
  let blend = texelPosition - baseTexel;
  let maxTexel = vec2i(frame.internalSize) - 1;
  let origin = vec2i(baseTexel);
  let s00 = textureLoad(skyDirectionTexture, clamp(origin, vec2i(0), maxTexel), 0);
  let s10 = textureLoad(skyDirectionTexture, clamp(origin + vec2i(1, 0), vec2i(0), maxTexel), 0);
  let s01 = textureLoad(skyDirectionTexture, clamp(origin + vec2i(0, 1), vec2i(0), maxTexel), 0);
  let s11 = textureLoad(skyDirectionTexture, clamp(origin + vec2i(1, 1), vec2i(0), maxTexel), 0);
  let valid = vec4f(step(1e-6, s00.w), step(1e-6, s10.w), step(1e-6, s01.w), step(1e-6, s11.w));
  let weights = vec4f((1.0 - blend.x) * (1.0 - blend.y), blend.x * (1.0 - blend.y), (1.0 - blend.x) * blend.y, blend.x * blend.y) * valid;
  let totalWeight = weights.x + weights.y + weights.z + weights.w;
  if (totalWeight < 1e-5) {
    return vec3f(0.0);
  }
  let direction = normalize(s00.xyz * weights.x + s10.xyz * weights.y + s01.xyz * weights.z + s11.xyz * weights.w);
  let skyRedshift = (s00.w * weights.x + s10.w * weights.y + s01.w * weights.z + s11.w * weights.w) / totalWeight;
  var ddx = mix(s10.xyz - s00.xyz, s11.xyz - s01.xyz, blend.y) * internalPerSky.x;
  var ddy = mix(s01.xyz - s00.xyz, s11.xyz - s10.xyz, blend.x) * internalPerSky.y;
  if (valid.x * valid.y * valid.z * valid.w < 0.5) {
    let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(direction.x) > 0.9);
    let tangentA = normalize(cross(direction, helper));
    let tangentB = cross(direction, tangentA);
    ddx = tangentA * frame.skyPixelAngle * 6.0;
    ddy = tangentB * frame.skyPixelAngle * 6.0;
  }
  let features = u32(frame.compositeFeatureMask);
  var radiance = vec3f(0.0);
  if ((features & 2u) != 0u) {
    radiance += galaxyRadiance(direction, ddx, ddy, skyRedshift) * frame.skyBrightness;
  }
  if ((features & 1u) != 0u) {
    let bandStrength = clamp(luminance(textureSampleLevel(galaxyTexture, linearSampler, direction, 4.0).rgb) / GALAXY_BAND_FULL_LUMINANCE, 0.0, 1.0);
    radiance += starRadiance(direction, ddx, ddy, skyRedshift, bandStrength) * frame.starBrightness;
  }
  return radiance;
}

@fragment fn skyFragment(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
  let internalPerSky = frame.internalSize / frame.skySize;
  return vec4f(skyRadiance(fragCoord.xy * internalPerSky, internalPerSky), 1.0);
}
`;

const WGSL_COMPOSITE = `
@group(1) @binding(0) var diskTexture: texture_2d<f32>;
@group(1) @binding(1) var skyRadianceTexture: texture_2d<f32>;
@group(1) @binding(2) var bloomTexture: texture_2d<f32>;
@group(1) @binding(3) var linearSampler: sampler;

fn agxContrast(x: vec3f) -> vec3f {
  let x2 = x * x;
  let x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}

fn agxToneMap(color: vec3f) -> vec3f {
  let inset = mat3x3f(
    vec3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051),
    vec3f(0.0784335999999992, 0.878468636469772, 0.0784336),
    vec3f(0.0792237451477643, 0.0791661274605434, 0.879142973793104));
  let outset = mat3x3f(
    vec3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438),
    vec3f(-0.0980208811401368, 1.15190312990417, -0.0980434501171241),
    vec3f(-0.0990297440797205, -0.0989611768448433, 1.15107367264116));
  let minEv = -12.47393;
  let maxEv = 4.026069;
  var encoded = clamp(log2(max(inset * color, vec3f(1e-10))), vec3f(minEv), vec3f(maxEv));
  encoded = agxContrast((encoded - minEv) / (maxEv - minEv));
  if (frame.cinematicLook > 0.5) {
    let graded = pow(max(encoded * vec3f(1.0, 0.92, 0.76), vec3f(0.0)), vec3f(1.2));
    let gradedLuma = luminance(graded);
    encoded = gradedLuma + 1.3 * (graded - gradedLuma);
  } else {
    let graded = pow(max(encoded, vec3f(0.0)), vec3f(1.1));
    let gradedLuma = luminance(graded);
    encoded = gradedLuma + 1.2 * (graded - gradedLuma);
  }
  return clamp(outset * encoded, vec3f(0.0), vec3f(1.0));
}

@fragment fn compositeFragment(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
  let internalPerOutput = frame.internalSize / frame.outputSize;
  let internalPosition = fragCoord.xy * internalPerOutput;
  let diskUv = clamp(internalPosition, vec2f(0.5), frame.internalSize - 0.5) / frame.renderTargetSize;
  let disk = textureSampleLevel(diskTexture, linearSampler, diskUv, 0.0);
  let outputUv = fragCoord.xy / frame.outputSize;
  var scene = disk.rgb + disk.a * textureSampleLevel(skyRadianceTexture, linearSampler, outputUv, 0.0).rgb;
  scene += frame.bloomStrength * textureSampleLevel(bloomTexture, linearSampler, outputUv, 0.0).rgb;
  let centered = (fragCoord.xy / frame.outputSize - 0.5) * vec2f(frame.outputSize.x / frame.outputSize.y, 1.0);
  scene *= 1.0 - frame.vignetteStrength * dot(centered, centered);
  var color = agxToneMap(scene * frame.exposure);
  if (frame.debugView > 0.5) {
    color = clamp(disk.rgb * 0.25, vec3f(0.0), vec3f(1.0));
  }
  let pixelSeed = u32(fragCoord.x) * 1973u + u32(fragCoord.y) * 9277u + u32(frame.frameIndex) * 26699u;
  let grain = hashToUnit(pixelSeed) + hashToUnit(pixelSeed ^ 0x5bd1e995u) - 1.0;
  let luma = luminance(color);
  color += grain * frame.grainStrength * (0.12 + 2.4 * luma * (1.0 - luma));
  return vec4f(color, 1.0);
}
`;

const WGSL_GALAXY = `
struct GalaxyFace {
  faceIndex: f32,
  faceSize: f32,
  unusedA: f32,
  unusedB: f32,
}
@group(0) @binding(0) var<uniform> galaxyFace: GalaxyFace;
@group(0) @binding(1) var blackbodyTable: texture_2d<f32>;

fn sphereFbm(position: vec3f, octaves: i32) -> f32 {
  var sum = 0.0;
  var amplitude = 0.5;
  var samplePosition = position;
  for (var octave = 0; octave < octaves; octave++) {
    sum += amplitude * gradientNoise(samplePosition);
    samplePosition = samplePosition * 2.03 + vec3f(5.1, 1.3, 7.7);
    amplitude *= 0.5;
  }
  return sum;
}

fn cubeTexelDirection(face: u32, uv: vec2f) -> vec3f {
  let sc = uv.x * 2.0 - 1.0;
  let tc = uv.y * 2.0 - 1.0;
  switch (face) {
    case 0u: { return vec3f(1.0, -tc, -sc); }
    case 1u: { return vec3f(-1.0, -tc, sc); }
    case 2u: { return vec3f(sc, 1.0, tc); }
    case 3u: { return vec3f(sc, -1.0, -tc); }
    case 4u: { return vec3f(sc, -tc, 1.0); }
    default: { return vec3f(-sc, -tc, -1.0); }
  }
}

@fragment fn galaxyFragment(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
  let direction = normalize(cubeTexelDirection(u32(galaxyFace.faceIndex), fragCoord.xy / galaxyFace.faceSize));
  let north = normalize(vec3f(0.45, 0.89, 0.0));
  let centerGuess = normalize(vec3f(0.0, 0.0, -1.0) + 0.13 * vec3f(0.89, -0.45, 0.0));
  let center = normalize(centerGuess - dot(centerGuess, north) * north);
  let east = cross(north, center);
  let latitude = asin(clamp(dot(direction, north), -1.0, 1.0));
  let longitude = atan2(dot(direction, east), dot(direction, center));
  let warp = vec3f(sphereFbm(direction * 3.0 + vec3f(11.0, 0.0, 0.0), 4), sphereFbm(direction * 3.0 + vec3f(0.0, 23.0, 0.0), 4), 0.0) * 0.06;
  let warpedLatitude = latitude + warp.x;
  let thickness = 0.06 + 0.035 * exp(-longitude * longitude * 1.5);
  let diskProfile = exp(-abs(warpedLatitude) / thickness) * (0.28 + 0.72 * exp(-longitude * longitude / 1.1));
  let bulgeProfile = exp(-(longitude * longitude + 2.4 * warpedLatitude * warpedLatitude) / (2.0 * 0.11 * 0.11));
  let clouds = sphereFbm(direction * 9.0, 6);
  let cloudBrightness = clamp(0.55 + 1.4 * clouds, 0.15, 1.8);
  let dustNoise = sphereFbm(direction * 14.0 + vec3f(4.0, 9.0, 2.0), 6);
  let dustLane = exp(-pow(abs(warpedLatitude + 0.012) / 0.03, 1.6)) * smoothstep(-0.25, 0.35, dustNoise) * 2.6
    + exp(-abs(warpedLatitude) / 0.09) * smoothstep(0.15, 0.55, sphereFbm(direction * 26.0, 4)) * 0.9;
  let reddening = exp(-dustLane * vec3f(0.82, 1.0, 1.25));
  let diskLight = diskProfile * cloudBrightness * 0.85 * blackbodyChromaticity(6400.0);
  let bulgeLight = bulgeProfile * 2.2 * blackbodyChromaticity(4300.0);
  let youngLight = diskProfile * max(clouds - 0.12, 0.0) * 1.4 * blackbodyChromaticity(12000.0);
  let background = vec3f(0.0015) * blackbodyChromaticity(5200.0);
  let radiance = (diskLight + bulgeLight + youngLight) * reddening + background;
  let lightWeight = luminance(diskLight) + luminance(bulgeLight) + luminance(youngLight) + 1e-4;
  let effectiveTemperature = (luminance(diskLight) * 6400.0 + luminance(bulgeLight) * 4300.0 + luminance(youngLight) * 12000.0 + 1e-4 * 5200.0) / lightWeight;
  let reddenedTemperature = effectiveTemperature * mix(1.0, 0.75, clamp(dustLane * 0.4, 0.0, 1.0));
  return vec4f(radiance * 0.014, reddenedTemperature / 10000.0);
}
`;

const WGSL_MIP = `
@group(0) @binding(0) var mipSource: texture_2d<f32>;

@fragment fn mipFragment(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
  let destinationTexel = vec2i(fragCoord.xy);
  let source = destinationTexel * 2;
  let sum = textureLoad(mipSource, source, 0) + textureLoad(mipSource, source + vec2i(1, 0), 0)

}

function vectorLength(v) { return Math.hypot(v[0], v[1], v[2]); }
function normalizeVector(v) { const length = vectorLength(v); return [v[0] / length, v[1] / length, v[2] / length]; }
function crossProduct(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function dotProduct(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function scaleVector(v, s) { return [v[0] * s, v[1] * s, v[2] * s]; }
function addVectors(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function clampNumber(value, low, high) { return Math.min(Math.max(value, low), high); }
const DEGREES = Math.PI / 180;

function blackHoleAxesInWorld(tiltDegrees) {
  const tilt = tiltDegrees * DEGREES;
  return {
    x: [1, 0, 0],
    y: [0, Math.sin(tilt), -Math.cos(tilt)],
    z: [0, Math.cos(tilt), Math.sin(tilt)],
  };
}

function worldToBlackHole(axes, v) {
  return [dotProduct(v, axes.x), dotProduct(v, axes.y), dotProduct(v, axes.z)];
}

function boyerLindquistRadius(spin, positionBh) {
  const [x, y, z] = positionBh;
  const squaredDistance = x * x + y * y + z * z;
  const offset = squaredDistance - spin * spin;
  const radiusSquared = 0.5 * (offset + Math.sqrt(offset * offset + 4 * spin * spin * z * z));
  return Math.sqrt(Math.max(radiusSquared, 1e-12));
}

function cameraFrame(spin, positionBh) {
  const r = boyerLindquistRadius(spin, positionBh);
  const cosTheta = clampNumber(positionBh[2] / r, -0.999999, 0.999999);
  const sinTheta = Math.sqrt(1 - cosTheta * cosTheta);
  const phi = Math.atan2(positionBh[1], positionBh[0]);
  const cosPhi = Math.cos(phi);
  const sinPhi = Math.sin(phi);
  const sigma = r * r + spin * spin * cosTheta * cosTheta;
  const delta = r * r - 2 * r + spin * spin;
  const bigA = (r * r + spin * spin) ** 2 - spin * spin * delta * sinTheta * sinTheta;
  const lapse = Math.sqrt((sigma * delta) / bigA);
  const frameDragOmega = (2 * spin * r) / bigA;
  const cylindricalRadius = Math.sqrt(bigA / sigma) * sinTheta;
  const spheroidalRadius = Math.sqrt(r * r + spin * spin);
  return {
    r, sinTheta, cosTheta, phi, sigma, delta, bigA, lapse, frameDragOmega, cylindricalRadius,
    sphereUnit: [sinTheta * cosPhi, sinTheta * sinPhi, cosTheta],
    sphereThetaHat: [cosTheta * cosPhi, cosTheta * sinPhi, -sinTheta],
    phiHat: [-sinPhi, cosPhi, 0],
    radialHat: normalizeVector([(r / spheroidalRadius) * sinTheta * cosPhi, (r / spheroidalRadius) * sinTheta * sinPhi, cosTheta]),
    polarHat: normalizeVector([spheroidalRadius * cosTheta * cosPhi, spheroidalRadius * cosTheta * sinPhi, -r * sinTheta]),
  };
}
